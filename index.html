<!DOCTYPE html>
<html lang="uk" data-palette="lavender">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Сплюшка</title>
<meta name="theme-color" content="#f4f2fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11111a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сплюшка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Golos+Text:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=Montserrat+Alternates:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen phone app, glass cards over drifting pastel blobs, floating glass tab bar (Сон · Головна · Розвиток). */
/* theme colors are registered so they can glide between light and dark */
@property --bg{ syntax:"<color>"; inherits:true; initial-value:#f4f2fa; }
@property --text{ syntax:"<color>"; inherits:true; initial-value:#262335; }
@property --text-2{ syntax:"<color>"; inherits:true; initial-value:#6c6883; }
@property --line{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --surface{ syntax:"<color>"; inherits:true; initial-value:#fff; }
@property --glass{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --glass-strong{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --glass-border{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --hl-soft{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --sheen{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --rim{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --sh1{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --sh2{ syntax:"<color>"; inherits:true; initial-value:transparent; }
@property --ink{ syntax:"<color>"; inherits:true; initial-value:#231f33; }
@property --accent-text{ syntax:"<color>"; inherits:true; initial-value:#6a5bc0; }
@property --blob-op{ syntax:"<number>"; inherits:true; initial-value:.85; }
:root{
  --font:"Nunito";
  --font-stack: var(--font), -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
  --bg:#f4f2fa;
  --text:#262335;
  --text-2:#6c6883;
  --line:rgba(38,35,53,.08);
  --surface:#ffffff;
  --glass:rgba(255,255,255,.56);
  --glass-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.7);
  --sh1:rgba(60,48,110,.10); --sh2:rgba(60,48,110,.06);
  --shadow:0 10px 30px var(--sh1), 0 1px 2px var(--sh2);
  --blur:22px;
  --hl:rgba(255,255,255,.85); --hl-soft:rgba(255,255,255,.3); --rim:rgba(255,255,255,.72); --sheen:rgba(255,255,255,.12);
  --accent-text:color-mix(in srgb,var(--accent) 72%,var(--text));
  --blob-op:.85;
  --ink:#231f33;
  --warn:#e9a23b;
  --danger:#e0607a;
  /* palette: lavender (default) */
  --accent:#a593f5; --accent-soft:rgba(165,147,245,.18);
  --nap:#ffc9a6; --night:#8fa4f2;
  --b1:#d8ceff; --b2:#ffd6e7; --b3:#c6ecf5;
  color-scheme: light;
}
html[data-palette="mint"]{ --accent:#5cc7a8; --accent-soft:rgba(92,199,168,.18); --nap:#ffd79a; --night:#7fb0e6; --b1:#c4f0e1; --b2:#fff0c4; --b3:#d5e5ff; }
html[data-palette="peach"]{ --accent:#f4a184; --accent-soft:rgba(244,161,132,.2); --nap:#ffd27f; --night:#a79cf2; --b1:#ffdccd; --b2:#ffecbf; --b3:#e4daff; }
html[data-palette="sky"]{ --accent:#72b1ea; --accent-soft:rgba(114,177,234,.2); --nap:#ffcd9d; --night:#8e90ea; --b1:#cde5ff; --b2:#e1d9ff; --b3:#d2f3ea; }
html[data-palette="rose"]{ --accent:#ec93b6; --accent-soft:rgba(236,147,182,.2); --nap:#ffd2a0; --night:#9f9ce8; --b1:#ffd3e4; --b2:#e8dcff; --b3:#ffe8cd; }


html.dark{
  --bg:#11111a; --text:#ecebf6; --text-2:#a3a0b9; --line:rgba(255,255,255,.08);
  --surface:#1c1c29; --glass:rgba(30,30,46,.56); --hl-soft:rgba(255,255,255,.05); --sheen:rgba(255,255,255,.03); --rim:rgba(255,255,255,.14); --accent-text:var(--accent); --glass-strong:rgba(36,36,54,.85);
  --glass-border:rgba(255,255,255,.09);
  --sh1:rgba(0,0,0,.35); --sh2:rgba(0,0,0,.3);
  --blob-op:.30; --ink:#191626;
  color-scheme: dark;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-stack); font-size:16px; line-height:1.4; overflow:hidden; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; padding:0; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
h1,h2,h3{ text-wrap:balance; margin:0; }
.num{ font-variant-numeric:tabular-nums; }

/* background blobs */
.bg{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.blob{ position:absolute; width:70vmax; height:70vmax; border-radius:50%; opacity:var(--blob-op); will-change:transform; }
.b1{ background:radial-gradient(closest-side, var(--b1) 0%, color-mix(in srgb,var(--b1) 60%,transparent) 45%, transparent 100%); top:-22vmax; left:-18vmax; animation:drift1 26s ease-in-out infinite alternate; }
.b2{ background:radial-gradient(closest-side, var(--b2) 0%, color-mix(in srgb,var(--b2) 60%,transparent) 45%, transparent 100%); top:30%; right:-28vmax; animation:drift2 32s ease-in-out infinite alternate; }
.b3{ background:radial-gradient(closest-side, var(--b3) 0%, color-mix(in srgb,var(--b3) 60%,transparent) 45%, transparent 100%); bottom:-30vmax; left:-10vmax; animation:drift3 29s ease-in-out infinite alternate; }
@keyframes drift1{ to{ transform:translate(12vmax,8vmax) scale(1.1); } }
@keyframes drift2{ to{ transform:translate(-10vmax,-6vmax) scale(.92); } }
@keyframes drift3{ to{ transform:translate(14vmax,-10vmax) scale(1.08); } }

.glass{
  background:
    radial-gradient(130% 80% at 0% 0%, var(--hl-soft), transparent 42%),
    radial-gradient(90% 60% at 100% 100%, color-mix(in srgb,var(--sheen) 70%,transparent), transparent 55%),
    linear-gradient(118deg, transparent 32%, var(--sheen) 46%, transparent 60%),
    var(--glass);
  backdrop-filter:blur(var(--blur)) saturate(160%) brightness(1.02); -webkit-backdrop-filter:blur(var(--blur)) saturate(160%) brightness(1.02);
  border:1px solid var(--glass-border);
  box-shadow: inset 0 1.5px 0 var(--rim), inset 1px 0 0 color-mix(in srgb,var(--rim) 45%,transparent), inset 0 -1px 0 color-mix(in srgb,var(--rim) 25%,transparent), var(--shadow);
}

#app{ position:relative; z-index:1; height:100%; }
#views{ position:absolute; inset:0; overflow:hidden; }
.view{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 112px);
  pointer-events:none; will-change:transform; backface-visibility:hidden; -webkit-backface-visibility:hidden; transition:transform .42s cubic-bezier(.22,.8,.24,1); }
.view.active{ pointer-events:auto; }
.wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

/* header */
.top{ display:flex; align-items:center; gap:12px; padding:4px 2px 2px; }
.top .titles{ flex:1; min-width:0; }
.hello{ font-size:14px; color:var(--text-2); font-weight:600; }
.big-title{ font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
.icon-btn{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; position:relative; transition:transform .2s; }
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.avatar{ font-weight:800; font-size:18px; background:linear-gradient(140deg,var(--accent),var(--nap)); color:var(--ink); border:2px solid var(--glass-border); }
.sync-dot{ position:absolute; right:1px; bottom:1px; width:12px; height:12px; border-radius:50%; border:2px solid var(--bg); background:#b4b1c4; }
.sync-dot.synced{ background:#5cc98f; } .sync-dot.connecting,.sync-dot.slow{ background:var(--warn); } .sync-dot.error{ background:var(--danger); }

/* cards */
.card{ border-radius:26px; padding:18px; }
.card h2{ font-size:17px; font-weight:800; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.muted{ color:var(--text-2); }
.small{ font-size:13px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:13px; font-weight:700; background:var(--accent-soft); color:var(--text); }
.chip.warn{ background:rgba(233,162,59,.18); } .chip.ok{ background:rgba(92,201,143,.18); } .chip.night{ background:color-mix(in srgb,var(--night) 25%,transparent); } .chip.nap{ background:color-mix(in srgb,var(--nap) 40%,transparent); }

/* hero status */
.hero{ display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; }
.ring{ width:112px; height:112px; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .track{ stroke:var(--line); }
.ring .bar{ stroke:var(--accent); transition:stroke-dashoffset 1s linear, stroke .4s; }
.ring.asleep .bar{ stroke:var(--night); }
.ring.late .bar{ stroke:var(--warn); }
.ring .center{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.ring .center b{ font-size:17px; font-weight:800; display:block; line-height:1.1; }
.ring .center span{ font-size:11px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.state-label{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-2); }
.state-main{ font-size:22px; font-weight:800; margin:2px 0 4px; }
.main-btn{ width:100%; margin-top:14px; padding:16px; border-radius:20px; font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--accent); color:var(--ink); box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent); transition:transform .15s, box-shadow .3s; }
.main-btn.wake{ background:var(--nap); box-shadow:0 8px 22px color-mix(in srgb,var(--nap) 50%,transparent); }
.main-btn:active{ transform:scale(.97); }
.main-btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.seg{ display:flex; gap:4px; padding:4px; border-radius:16px; background:var(--line); position:relative; }
.seg button{ flex:1; padding:8px 10px; border-radius:12px; font-size:14px; font-weight:700; color:var(--text-2); position:relative; z-index:1; transition:color .25s; }
.seg button.on{ color:var(--text); }
.seg .pill{ position:absolute; top:4px; bottom:4px; border-radius:12px; background:var(--glass-strong); box-shadow:0 2px 8px rgba(0,0,0,.08); transition:left .45s cubic-bezier(.34,1.4,.5,1), width .45s cubic-bezier(.34,1.4,.5,1); }
.kind-row{ margin-top:12px; }

/* prediction */
.pred-time{ font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; }
.pred-grid{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.plan-list{ display:flex; flex-direction:column; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.plan-row{ display:flex; justify-content:space-between; font-size:15px; }
.plan-row b{ font-weight:800; }

/* timeline */
.tl{ position:relative; height:30px; border-radius:10px; background:var(--line); overflow:hidden; }
.tl i{ position:absolute; top:0; bottom:0; border-radius:6px; }
.tl i.nap{ background:var(--nap); } .tl i.night{ background:var(--night); }
.tl i.pred{ background:repeating-linear-gradient(135deg, color-mix(in srgb,var(--accent) 55%,transparent) 0 5px, transparent 5px 9px); border:1.5px dashed var(--accent); }
.tl .now{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text); border-radius:2px; }
.tl-axis{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-2); margin-top:5px; font-weight:600; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
.stat{ padding:10px 12px; border-radius:16px; background:var(--line); }
.stat b{ display:block; font-size:17px; font-weight:800; }
.stat span{ font-size:12px; color:var(--text-2); font-weight:600; }

/* age */
.age-main{ font-size:24px; font-weight:800; letter-spacing:-.01em; }
.age-sub{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }

/* hint */
.hint{ display:flex; gap:14px; align-items:flex-start; cursor:pointer; text-align:left; width:100%; }
.hint .ico{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; flex:none; background:var(--accent-soft); }
.hint .ico svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.hint h3{ font-size:16px; font-weight:800; margin-bottom:3px; }

/* forms */
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:13px; font-weight:700; color:var(--text-2); }
.input{ width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:var(--glass-strong); font-size:16px; outline:none; transition:border-color .2s; min-height:48px; }
.input:focus{ border-color:var(--accent); }
.form{ display:flex; flex-direction:column; gap:12px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn{ padding:13px 16px; border-radius:16px; font-weight:800; font-size:16px; background:var(--accent); color:var(--ink); transition:transform .15s; }
.btn:active{ transform:scale(.97); }
.btn.ghost{ background:var(--line); color:var(--text); }
.btn.danger{ background:rgba(224,96,122,.16); color:var(--danger); }
.btn.sm{ padding:9px 13px; font-size:14px; border-radius:13px; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0; }
.switch{ width:52px; height:32px; border-radius:999px; background:var(--line); position:relative; flex:none; transition:background .25s; }
.switch::after{ content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform .3s cubic-bezier(.34,1.5,.5,1); }
.switch.on{ background:var(--accent); }
.switch.on::after{ transform:translateX(20px); }

/* journal */
.week{ display:flex; flex-direction:column; gap:7px; }
.wk-row{ display:grid; grid-template-columns:44px 1fr 58px; gap:8px; align-items:center; font-size:12px; font-weight:700; }
.wk-row .tl{ height:18px; border-radius:6px; }
.wk-row .tl i{ border-radius:3px; }
.wk-row .tot{ text-align:right; color:var(--text-2); }
.legend{ display:flex; gap:14px; font-size:12px; color:var(--text-2); font-weight:600; margin-top:10px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.day-group h3{ font-size:14px; font-weight:800; color:var(--text-2); margin:6px 4px 8px; }
.day-group h3::first-letter{ text-transform:uppercase; }
.entry{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; width:100%; text-align:left; margin-bottom:8px; }
.entry .dot{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; }
.entry .dot.nap{ background:color-mix(in srgb,var(--nap) 55%,transparent); } .entry .dot.night{ background:color-mix(in srgb,var(--night) 45%,transparent); }
.entry .dot svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.entry .info{ flex:1; min-width:0; }
.entry .t{ display:block; font-weight:800; font-size:15px; }
.entry .s{ display:block; font-size:13px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entry .d{ font-weight:800; font-size:14px; white-space:nowrap; }

/* sounds */
.sounds{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.snd{ border-radius:22px; padding:16px 14px; text-align:left; display:flex; flex-direction:column; gap:10px; min-height:104px; position:relative; overflow:hidden; transition:transform .2s; }
.snd:active{ transform:scale(.96); }
.snd .si{ width:40px; height:40px; border-radius:14px; display:grid; place-items:center; background:var(--accent-soft); }
.snd .si svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.snd b{ font-size:15px; font-weight:800; }
.snd span{ font-size:12px; color:var(--text-2); font-weight:600; }
.snd.on{ background:color-mix(in srgb,var(--accent) 30%,var(--glass)); border-color:var(--accent); }
.snd .eq{ position:absolute; right:14px; top:18px; display:none; gap:3px; align-items:flex-end; height:18px; }
.snd.on .eq{ display:flex; }
.eq i{ width:3px; border-radius:2px; background:var(--text); animation:eq 1s ease-in-out infinite; }
.eq i:nth-child(2){ animation-delay:.2s; } .eq i:nth-child(3){ animation-delay:.45s; }
@keyframes eq{ 0%,100%{ height:5px; } 50%{ height:17px; } }
.player{ display:flex; flex-direction:column; gap:14px; }
.player-top{ display:flex; align-items:center; gap:14px; }
.play{ width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--ink); display:grid; place-items:center; flex:none; box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent); }
.play svg{ width:26px; height:26px; fill:currentColor; }
.range{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; background:var(--line); outline:none; }
.range::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.25); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chips button{ padding:8px 13px; border-radius:999px; background:var(--line); font-size:14px; font-weight:700; }
.chips button.on{ background:var(--accent); color:var(--ink); }
/* v1.1 lullabies */
.lulls .seg{ margin-bottom:10px; }
.lrows{ display:flex; flex-direction:column; gap:4px; }
.lrow{ display:flex; align-items:center; gap:10px; padding:6px 4px; border-radius:16px; transition:background .25s; }
.lrow.on{ background:color-mix(in srgb,var(--accent) 22%,transparent); }
.lplay{ width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--accent-soft); color:var(--text); font-weight:800; }
.lplay svg{ width:18px; height:18px; fill:currentColor; margin-left:2px; }
.lplay:disabled{ opacity:.55; }
.lplay .eq{ display:flex; gap:3px; align-items:flex-end; height:18px; }
.lrow.on .lplay{ background:var(--accent); color:var(--ink); }
.ltxt{ flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; }
.ltxt b{ font-size:15px; font-weight:800; }
.ltxt span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lchip{ flex:none; padding:7px 11px; border-radius:999px; background:var(--line); font-size:13px; font-weight:800; }
.spinner.sm{ width:18px; height:18px; border-width:2px; margin:0; }
.lyrics{ white-space:pre-line; font-size:19px; line-height:1.65; font-weight:600; padding:4px 2px; }

/* tips */
.tip{ border-radius:20px; overflow:hidden; margin-bottom:10px; }
.tip summary{ list-style:none; padding:15px 16px; font-weight:800; display:flex; align-items:center; gap:10px; cursor:pointer; }
.tip summary::-webkit-details-marker{ display:none; }
.tip summary::after{ content:""; margin-left:auto; width:9px; height:9px; border-right:2px solid var(--text-2); border-bottom:2px solid var(--text-2); transform:rotate(45deg); transition:transform .3s; flex:none; }
.tip[open] summary::after{ transform:rotate(-135deg); }
.tip .body{ padding:0 16px 16px; color:var(--text-2); font-size:15px; }
.tip .body p{ margin:0 0 8px; }
.tip .body ul,.tip .body ol{ margin:0 0 8px; padding-left:20px; }
.tag{ font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:var(--accent); color:var(--ink); }
.signs{ list-style:none; padding:0; margin:10px 0; display:flex; flex-direction:column; gap:8px; }
.signs li{ display:flex; gap:10px; align-items:flex-start; font-size:15px; }
.signs .mark{ width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:800; background:var(--line); color:var(--text-2); }
.signs li.yes .mark{ background:var(--accent); color:var(--ink); }
.signs li.na{ opacity:.55; }

/* development */
.dev-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.dev-card{ border-radius:22px; padding:16px; min-height:128px; display:flex; flex-direction:column; justify-content:space-between; text-align:left; position:relative; }
.dev-card .em{ font-size:34px; line-height:1; }
.dev-card b{ font-size:15px; font-weight:800; }
.dev-card .soon{ position:absolute; top:12px; right:12px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:var(--line); color:var(--text-2); }
.animals{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.animal{ aspect-ratio:1; border-radius:18px; display:grid; place-items:center; font-size:30px; background:var(--line); }

/* tab bar (WhatsApp-style, draggable capsule bubble) */
.tabbar{ position:fixed; z-index:20; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 12px); width:min(330px, calc(100% - 40px)); height:74px; border-radius:37px; display:flex; align-items:center; padding:0 6px; touch-action:none; user-select:none; -webkit-user-select:none; }
.tab{ flex:1; height:100%; position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-2); font-size:11px; font-weight:800; transition:color .25s; }
.tab svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; transition:transform .4s cubic-bezier(.34,1.6,.5,1); }
.tab.active{ color:var(--accent-text); }
.tabbar.drag .tab.active:not(.hot), .tabbar.follow .tab.active:not(.hot){ color:var(--text-2); }
.tab.hot{ color:var(--accent-text); }
.tab.hot svg{ transform:scale(1.12); }
.bubble{ position:absolute; z-index:1; top:6px; bottom:6px; left:0; width:var(--bw,96px); pointer-events:none; transition:transform .55s cubic-bezier(.34,1.3,.5,1); will-change:transform; }
.bub{ position:absolute; inset:0; border-radius:31px; /* = радіус панелі (37) − відступ (6) */
  background: radial-gradient(100% 100% at 30% 18%, color-mix(in srgb,var(--rim) 70%,transparent), transparent 46%), var(--accent-soft);
  box-shadow: inset 0 1.5px 0 var(--rim), inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent), 0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent);
  transition: transform .4s cubic-bezier(.34,1.5,.5,1), inset .35s cubic-bezier(.34,1.5,.5,1), border-radius .35s, background .3s, box-shadow .3s; }
.bub.pop{ animation:bubpop .5s cubic-bezier(.3,1.4,.5,1); }
@keyframes bubpop{ 0%{ transform:scale(1); } 35%{ transform:scale(1.06,.94); } 70%{ transform:scale(.98,1.02); } 100%{ transform:scale(1); } }
.tabbar.drag .bubble{ transition:transform .07s linear; }
.tabbar.follow .bubble{ transition:none; }
.tabbar.drag .bub{ inset:-7px -9px; border-radius:38px;
  background: radial-gradient(90% 70% at 30% 15%, rgba(255,255,255,.55), transparent 50%), rgba(255,255,255,.10);
  backdrop-filter:blur(1.5px) saturate(1.9) brightness(1.12); -webkit-backdrop-filter:blur(1.5px) saturate(1.9) brightness(1.12);
  box-shadow: inset 2.5px 2.5px 3px rgba(255,90,190,.45), inset -2.5px -2.5px 3px rgba(70,200,255,.5), inset 0 -2px 2px rgba(255,230,90,.35), inset 0 0 0 1px rgba(255,255,255,.75), 0 10px 26px rgba(0,0,0,.2); }
.view{ touch-action:pan-y; }
#views.swiping .view{ pointer-events:none; overflow-y:hidden; }

/* sheets */
.backdrop{ position:fixed; inset:0; z-index:40; background:rgba(15,12,30,.35); opacity:0; transition:opacity .3s; }
.backdrop.show{ opacity:1; }
.sheet{ position:fixed; z-index:41; left:0; right:0; bottom:0; margin:0 auto; max-width:600px; max-height:90%; overflow-y:auto; border-radius:30px 30px 0 0; padding:10px 18px calc(env(safe-area-inset-bottom) + 24px); transform:translateY(105%); transition:transform .5s cubic-bezier(.2,.95,.25,1); background:var(--glass-strong); }
.sheet.show{ transform:none; }
.grabber{ width:40px; height:5px; border-radius:5px; background:var(--line); margin:4px auto 14px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head h2{ font-size:22px; font-weight:800; }
.sec-title{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-2); margin:22px 4px 8px; }
.group{ border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:12px; background:var(--line); }
.swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.sw{ width:44px; height:44px; border-radius:50%; border:3px solid transparent; transition:transform .2s; }
.sw.on{ border-color:var(--text); transform:scale(1.08); }
.opt-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt-list button{ padding:11px 12px; border-radius:14px; background:var(--glass-strong); text-align:left; font-weight:700; font-size:15px; border:2px solid transparent; }
.opt-list button.on{ border-color:var(--accent); }

/* toast */
#toast{ position:fixed; z-index:60; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:10px 14px; border-radius:18px; font-weight:700; font-size:13.5px; line-height:1.3; display:flex; gap:12px; align-items:center; width:max-content; max-width:calc(100vw - 32px); transition:opacity .3s, transform .4s cubic-bezier(.3,1.4,.5,1); }
#toast.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
#toast button{ font-weight:800; color:var(--accent); white-space:nowrap; flex:none; }
#toast > span{ min-width:0; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; }

/* theme switch without jank */
::view-transition-old(root), ::view-transition-new(root){ animation-duration:.38s; animation-timing-function:ease; mix-blend-mode:normal; }
::view-transition-group(root){ animation-duration:.38s; }
.theme-veil{ position:fixed; inset:0; z-index:9999; pointer-events:none; animation:veilOut .38s ease forwards; }
@keyframes veilOut{ from{ opacity:.7; } to{ opacity:0; } }
html.no-tr *:not(.pill), html.no-tr *::before, html.no-tr *::after{ transition:none !important; }
[data-act="theme"] svg{ animation:themeSpin .45s cubic-bezier(.3,1.4,.5,1); }
@keyframes themeSpin{ from{ transform:rotate(-90deg) scale(.6); opacity:0; } to{ transform:none; opacity:1; } }

/* overlap hardening */
.hero > *, .stats > *, .row2 > *, .pred-grid > *, .wk-row > *, .player-top > *, .toggle-row > *, .card-head > *, .top > *, .hint > *, .entry > * { min-width:0; }
.card, .banner, .entry, .hint, .stat { overflow-wrap:break-word; }
input[type="date"].input, input[type="datetime-local"].input{ -webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; text-align:left; }
input::-webkit-date-and-time-value{ text-align:left; }
.pred-grid{ flex-wrap:wrap; }
.stat b{ font-size:16px; }

/* avatar photo */
.avatar{ padding:0; }
.avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.photo-row{ display:flex; align-items:center; gap:14px; }
.photo-big{ width:84px; height:84px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:34px; font-weight:800; overflow:hidden; background:linear-gradient(140deg,var(--accent),var(--nap)); color:var(--ink); }
.photo-big img{ width:100%; height:100%; object-fit:cover; }
.btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
label.btn{ display:inline-flex; align-items:center; cursor:pointer; }
.vh{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

/* animals */
.agrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.acard{ border-radius:22px; padding:10px 6px 12px; background:var(--abg); display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:800; font-size:14px; color:#2b2433; transition:transform .2s; min-width:0; }
.acard:active{ transform:scale(.93); }
html.dark .acard{ background:color-mix(in srgb,var(--abg) 26%,var(--surface)); color:var(--text); }
.art{ width:100%; max-width:96px; aspect-ratio:1; }
.art svg, .art img{ width:100%; height:100%; display:block; object-fit:cover; border-radius:20px; }
.art img.pic{ object-fit:contain; border-radius:0; -webkit-user-drag:none; user-select:none; }
/* shadow stays inside the box: Safari clips filters at the layer edge */
.stage-art{ position:relative; }
.stage-art img.pic{ width:84%; height:84%; margin:6% auto 0; filter:drop-shadow(0 6px 7px rgba(60,40,110,.16)); }
.stage-art::after{ content:""; position:absolute; left:24%; right:24%; bottom:1%; height:7%; border-radius:50%; background:radial-gradient(closest-side, rgba(60,40,110,.2), transparent); z-index:-1; pointer-events:none; }
html.dark .stage-art img.pic{ filter:drop-shadow(0 6px 7px rgba(0,0,0,.35)); }
#stage{ position:fixed; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px); background:color-mix(in srgb,var(--abg) 70%,var(--bg)); opacity:0; transition:opacity .3s; }
html.dark #stage{ background:color-mix(in srgb,var(--abg) 18%,var(--bg)); }
#stage.show{ opacity:1; }
.stage-close{ position:absolute; top:calc(env(safe-area-inset-top) + 14px); right:16px; }
.stage-art{ width:min(60vw,260px); aspect-ratio:1; }
.stage-art.pop{ animation:pop .55s cubic-bezier(.3,1.6,.5,1); }
.stage-art.talk{ animation:wiggle .5s ease-in-out infinite; }
.stage-name{ font-size:38px; font-weight:800; letter-spacing:-.02em; text-align:center; }
.stage-says{ font-size:24px; font-weight:800; color:var(--text-2); text-align:center; }
.stage-nav{ display:flex; gap:16px; margin-top:18px; }
.stage-nav .icon-btn{ width:60px; height:60px; }
.stage-nav .icon-btn svg{ width:26px; height:26px; }
.stage-note{ font-size:13px; color:var(--text-2); text-align:center; min-height:1.2em; max-width:300px; }
@keyframes pop{ 0%{ transform:scale(.6); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
@keyframes wiggle{ 0%,100%{ transform:rotate(0) scale(1); } 25%{ transform:rotate(-4deg) scale(1.04); } 75%{ transform:rotate(4deg) scale(1.04); } }
.alist{ display:flex; flex-direction:column; gap:8px; }
.arow{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:18px; background:var(--glass-strong); text-align:left; width:100%; }
.arow .art{ width:48px; flex:none; }
.arow .art svg, .arow .art img{ border-radius:14px; }
.arow b{ display:block; font-size:15px; }
.media-box{ border-radius:18px; padding:12px 14px; background:var(--line); display:flex; flex-direction:column; gap:10px; }
.media-box .mh{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-weight:800; }

/* v0.9 · development: checklist, skills, animal modes */
/* резервна копія */
#bk-bar{ position:fixed; z-index:55; left:50%; transform:translate(-50%,20px); bottom:calc(env(safe-area-inset-bottom) + 100px); width:min(340px,calc(100% - 28px)); padding:12px 14px; border-radius:22px; display:none; flex-direction:column; gap:10px; opacity:0; transition:opacity .3s, transform .4s cubic-bezier(.22,.8,.24,1); }
#bk-bar.show{ opacity:1; transform:translate(-50%,0); }
#bk-bar .t{ font-weight:700; font-size:14px; line-height:1.35; }
#bk-bar .r{ display:flex; gap:8px; justify-content:flex-end; }
.hidden{ display:none !important; }
.devday .card-head{ align-items:flex-start; }
.dring{ --p:0; width:54px; height:54px; flex:none; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 360deg), var(--accent-soft) 0); position:relative; }
.dring::before{ content:""; position:absolute; inset:6px; border-radius:50%; background:var(--glass-strong); }
.dring span{ position:relative; font-size:14px; font-weight:800; }
.checks{ display:flex; flex-direction:column; gap:8px; }
.chk{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:20px; background:var(--tile, var(--line)); cursor:pointer; transition:transform .15s, background .25s, opacity .25s; text-align:left; }
.chk:active{ transform:scale(.98); }
.chk .box{ width:28px; height:28px; flex:none; border-radius:50%; border:2px solid color-mix(in srgb,var(--accent) 55%,transparent); display:grid; place-items:center; transition:background .25s, border-color .25s; }
.chk .box svg{ width:18px; height:18px; fill:none; stroke:#2b2450; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; animation:tick .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes tick{ from{ transform:scale(0); } to{ transform:scale(1); } }
.chk.on .box{ background:var(--accent); border-color:var(--accent); }
.chk .txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.chk .txt b{ font-size:15px; font-weight:800; line-height:1.25; }
.chk .txt .small{ line-height:1.35; }
.chk.on .txt b{ text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--text) 35%,transparent); color:var(--text-2); }
.chk.sk.on .txt b{ text-decoration:none; color:var(--text); }
.chk .cat{ font-size:18px; flex:none; opacity:.85; }
.chk .swap{ width:34px; height:34px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--text-2); }
.chk .swap svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.chk.later{ opacity:.55; }
.dweek{ display:flex; justify-content:space-between; margin-top:14px; padding:0 2px; }
.wday{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:800; color:var(--text-2); }
.wday i{ --f:0; width:22px; height:22px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--f) * 360deg), var(--line) 0); }
.wday.now{ color:var(--text); }
.wday.now i{ box-shadow:0 0 0 2px var(--glass-strong), 0 0 0 4px color-mix(in srgb,var(--accent) 60%,transparent); }
.quiz-go{ width:100%; margin-top:12px; }
.art .emo{ width:100%; height:100%; display:grid; place-items:center; font-size:44px; font-weight:800; line-height:1; color:#5b4f86; }
.arow .art .emo{ font-size:24px; } .stage-art .emo{ font-size:120px; } .qopt .art .emo{ font-size:64px; } .quiz-opts.k3 .qopt .art .emo{ font-size:46px; } #aePrev .emo{ font-size:52px; }
.arow.gone{ opacity:.7; }
.pill-btn{ height:60px; padding:0 20px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:16px; }
.pill-btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.stage-nav{ align-items:center; }
/* quiz */
#stage.quiz{ background:color-mix(in srgb,var(--accent) 16%,var(--bg)); gap:14px; }
.quiz-score{ position:absolute; top:calc(env(safe-area-inset-top) + 22px); left:20px; font-size:20px; font-weight:800; }
.quiz-score.bump{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
.quiz-q{ font-size:22px; font-weight:700; text-align:center; color:var(--text-2); line-height:1.25; }
.quiz-q b{ font-size:34px; color:var(--text); letter-spacing:-.01em; }
.quiz-hear{ height:52px; }
.quiz-opts{ display:flex; gap:12px; justify-content:center; width:100%; max-width:560px; margin-top:6px; }
.qopt{ flex:1; max-width:250px; min-width:0; border-radius:28px; padding:12px 8px 14px; background:var(--abg); display:flex; flex-direction:column; align-items:center; gap:6px; color:#2b2433; font-weight:800; font-size:16px; position:relative; transition:transform .2s, opacity .3s; box-shadow:0 14px 30px -16px var(--sh1); }
html.dark .qopt{ background:color-mix(in srgb,var(--abg) 26%,var(--surface)); color:var(--text); }
.qopt .art{ max-width:none; }
.qopt .art img.pic{ width:88%; height:88%; margin:6% auto 0; }
.quiz-opts.k3 .qopt{ font-size:14px; border-radius:24px; padding:10px 6px 12px; }
.qopt:active{ transform:scale(.95); }
.qopt.right{ transform:scale(1.07); box-shadow:0 0 0 4px #7fd6a2, 0 18px 36px -14px rgba(60,160,100,.45); z-index:1; }
.qopt.right .art{ animation:wiggle .5s ease-in-out 2; }
.qopt.fade{ opacity:.25; transform:scale(.94); }
.qopt.wrong{ animation:shake .45s ease; }
.qopt.tried{ opacity:.5; }
@keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-10px); } 40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(4px); } }
.burst{ position:absolute; left:50%; top:40%; width:0; height:0; pointer-events:none; }
.burst i{ position:absolute; width:12px; height:12px; margin:-6px; background:var(--star, #ffd36b); clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:burst .8s ease-out forwards; }
.burst i:nth-child(1){ --a:0deg; } .burst i:nth-child(2){ --a:45deg; } .burst i:nth-child(3){ --a:90deg; } .burst i:nth-child(4){ --a:135deg; }
.burst i:nth-child(5){ --a:180deg; } .burst i:nth-child(6){ --a:225deg; } .burst i:nth-child(7){ --a:270deg; } .burst i:nth-child(8){ --a:315deg; }
@keyframes burst{ from{ transform:rotate(var(--a)) translateY(0) scale(.4); opacity:1; } to{ transform:rotate(var(--a)) translateY(-90px) scale(1.1); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .qopt.wrong, .qopt.right .art, .burst i{ animation:none; } }

.loading{ text-align:center; padding:40px 10px; }
.spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); margin:0 auto 14px; animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.banner{ border-radius:18px; padding:12px 14px; font-size:14px; font-weight:600; display:flex; gap:10px; align-items:flex-start; }
.signout{ display:block; margin:22px auto 0; padding:10px 18px; border:0; border-radius:999px; background:transparent; color:var(--accent-text); font-weight:800; font-size:14px; cursor:pointer; }
.disclaimer{ font-size:12px; color:var(--text-2); text-align:center; padding:4px 10px; }


/* ===================== v0.5 · Soft Premium skin ===================== */
:root{
  --bg:#f6f2ff; --text:#2b2450; --text-2:#7d76a0; --line:rgba(98,78,190,.07);
  --glass:rgba(255,255,255,.74); --glass-strong:rgba(255,255,255,.9); --glass-border:rgba(255,255,255,.95);
  --sh1:rgba(108,84,200,.13); --sh2:rgba(108,84,200,.05);
  --shadow:0 16px 36px -14px var(--sh1), 0 2px 8px var(--sh2);
  --blur:18px; --hl-soft:rgba(255,255,255,.35); --sheen:rgba(255,255,255,.08); --rim:rgba(255,255,255,.95);
  --cloud:#ffffff; --cloud-op:.75; --star:#ffd36b; --tile:rgba(255,255,255,.62);
  --wake1:#ffdcb6; --wake2:#ffb886; --wake-ink:#3b2a1d;
}
html[data-palette="lavender"]{ --b1:#dcd2ff; --b2:#ffe2f0; --b3:#e6defe; }
html.dark{ --bg:#14121f; --text:#efeaff; --text-2:#a8a1c8; --glass:rgba(36,32,58,.72); --glass-strong:rgba(44,40,70,.92); --glass-border:rgba(255,255,255,.08);
  --cloud:#b9aef5; --cloud-op:.07; --star:#ffe08a; --tile:rgba(255,255,255,.05); --rim:rgba(255,255,255,.1); --hl-soft:rgba(255,255,255,.04); --sheen:rgba(255,255,255,.02); }

/* sky decorations */
.sky{ position:absolute; inset:0; width:100%; height:100%; }
.sky .cl{ fill:var(--cloud); opacity:var(--cloud-op); }
.sky .st{ fill:var(--star); transform-box:fill-box; transform-origin:center; animation:twinkle 3.6s ease-in-out infinite; }
.sky .st:nth-of-type(2n){ animation-delay:1.2s; } .sky .st:nth-of-type(3n){ animation-delay:2.1s; }
@keyframes twinkle{ 0%,100%{ opacity:.9; transform:scale(1); } 50%{ opacity:.35; transform:scale(.7); } }

/* type & header */
.big-title{ font-size:34px; font-weight:800; letter-spacing:-.025em; }
.hello{ font-size:14px; font-weight:700; color:var(--text-2); }
.icon-btn.glass{ box-shadow:0 8px 20px -8px var(--sh1); }
.avatar{ width:52px; height:52px; border:3px solid #fff; box-shadow:0 8px 20px -6px var(--sh1); }
html.dark .avatar{ border-color:rgba(255,255,255,.15); }
.sync-dot{ width:14px; height:14px; border:2.5px solid #fff; }

/* cards: soft "pillow" panels */
.card{ border-radius:30px; padding:18px; }
.glass{ background:linear-gradient(180deg, var(--hl-soft), transparent 40%), var(--glass); }
.card h2{ font-size:18px; }
.ht{ display:flex; align-items:center; gap:9px; }
.ht .hi{ width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-text); }
.ht .hi svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
.seg{ border-radius:999px; background:var(--accent-soft); }
.seg button{ border-radius:999px; }
.seg .pill{ border-radius:999px; background:var(--glass-strong); box-shadow:0 4px 12px -4px var(--sh1); }
.chip{ background:var(--accent-soft); }
.stat{ background:var(--tile); border-radius:20px; box-shadow:inset 0 0 0 1px var(--line); }

/* buttons */
.main-btn{ border-radius:999px; padding:17px; font-size:18px; color:var(--text);
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 55%,#fff), var(--accent));
  box-shadow:0 12px 26px -10px color-mix(in srgb,var(--accent) 80%,transparent), inset 0 1.5px 0 rgba(255,255,255,.6); color:#2b2450; }
.main-btn.wake{ background:linear-gradient(180deg,var(--wake1),var(--wake2)); color:var(--wake-ink);
  box-shadow:0 12px 26px -10px rgba(255,150,90,.7), inset 0 1.5px 0 rgba(255,255,255,.65); }
.btn{ border-radius:999px; }
.btn:not(.ghost):not(.danger){ background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 55%,#fff), var(--accent)); color:#2b2450; }

/* hero */
.hero-card{ position:relative; overflow:hidden; padding:14px 14px 16px; }
.hero-card::before{ content:""; position:absolute; inset:0 0 auto 0; height:62%; pointer-events:none;
  background:radial-gradient(90% 100% at 25% 10%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%); }
.hero2{ position:relative; display:grid; grid-template-columns:1fr auto; align-items:center; gap:0; min-height:168px; padding-top:6px; }
.illo{ position:static; margin:0 -6px -6px -12px; align-self:end; min-width:0; }
.illo svg{ width:calc(100% + 18px); max-width:250px; display:block; filter:drop-shadow(0 10px 14px rgba(108,84,200,.18)); }
html.dark .illo svg{ filter:brightness(.82) saturate(.95) drop-shadow(0 10px 14px rgba(0,0,0,.35)); }
.hero-chip{ position:absolute; top:4px; left:4px; z-index:2; }
.ring{ width:156px; height:156px; border-radius:50%; background:var(--glass-strong); box-shadow:0 14px 30px -12px var(--sh1), inset 0 0 0 6px color-mix(in srgb,var(--accent) 8%,transparent); }
.ring svg{ position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); }
.ring .track{ stroke:color-mix(in srgb,var(--accent) 16%,transparent); }
.ring .center b{ font-size:32px; letter-spacing:-.02em; }
.ring .center span{ font-size:12px; color:var(--text); text-transform:none; letter-spacing:0; font-weight:800; }
.ring .ri{ display:block; width:26px; height:26px; margin:0 auto 2px; color:var(--accent-text); }
.ring .ri svg{ position:static; width:100%; height:100%; transform:none; fill:currentColor; stroke:none; }
.ring.late .ri{ color:var(--warn); }
.facts{ position:relative; display:grid; grid-template-columns:1fr 1px 1fr; gap:12px; align-items:center; margin-top:12px; padding:14px 14px; border-radius:24px; background:var(--tile); box-shadow:inset 0 0 0 1px var(--line); }
.facts .sep{ width:1px; align-self:stretch; background:var(--line); }
.fact{ display:flex; gap:10px; align-items:flex-start; min-width:0; }
.fact .fi{ width:26px; height:26px; flex:none; color:var(--accent-text); }
.fact .fi svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.fact span{ display:block; font-size:13px; color:var(--text-2); font-weight:700; line-height:1.2; }
.fact b{ display:block; font-size:22px; font-weight:800; margin-top:3px; letter-spacing:-.01em; }
.hero-card .kind-row{ margin-top:12px; }

/* day rhythm */
.tl-wrap{ position:relative; padding-top:26px; }
.tl{ height:34px; border-radius:999px; background:color-mix(in srgb,var(--accent) 10%,transparent); box-shadow:inset 0 0 0 1px var(--line); }
.tl i{ border-radius:999px; }
.tl i.night{ background:linear-gradient(180deg, color-mix(in srgb,var(--night) 70%,#fff), var(--night)); }
.tl i.nap{ background:linear-gradient(180deg, color-mix(in srgb,var(--nap) 60%,#fff), var(--nap)); }
.now-mark{ position:absolute; top:0; bottom:-4px; width:0; }
.now-mark::after{ content:""; position:absolute; left:-1.5px; top:22px; bottom:0; width:3px; border-radius:3px; background:var(--text); }
.now-mark em{ position:absolute; top:0; left:0; transform:translateX(-50%); font-style:normal; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--text); color:var(--bg); white-space:nowrap; }
.now-mark em::after{ content:""; position:absolute; left:50%; bottom:-4px; margin-left:-4px; border:4px solid transparent; border-bottom:0; border-top-color:var(--text); }
.wk-row .tl{ height:18px; }
.legend i{ width:10px; height:10px; border-radius:50%; }
.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile{ border-radius:24px; padding:14px 8px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
.tile .ti{ width:30px; height:30px; color:var(--accent-text); margin-bottom:4px; }
.tile .ti svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.tile b{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
.tile span{ font-size:12px; font-weight:700; color:var(--text-2); line-height:1.2; }

/* tab bar */
.tabbar{ background:var(--glass-strong); }
.bub{ background:linear-gradient(180deg, #fff, color-mix(in srgb,var(--accent) 16%,#fff)); box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent), inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent); }
html.dark .bub{ background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 34%,transparent), color-mix(in srgb,var(--accent) 18%,transparent)); }
.tab{ font-size:12px; }

/* sheets */
.sheet{ border-radius:34px 34px 0 0; }

/* hero picture (v0.6): bunny on a cloud, timer inside the cloud */
.hero-card{ padding:0 14px 16px; }
.hero-card::before{ display:none; }
.hero-art{ position:relative; margin:0 -14px 4px; container-type:inline-size; }
.hero-art img{ width:100%; height:auto; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; filter:drop-shadow(0 14px 22px rgba(108,84,200,.18)); }
html.dark .hero-art img{ filter:brightness(.93) saturate(.95) drop-shadow(0 14px 22px rgba(0,0,0,.35)); }
.hero-art .hero-chip{ position:absolute; top:12px; left:12px; right:auto; z-index:2; background:rgba(255,255,255,.78); color:#2b2450; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 4px 14px -6px rgba(40,30,110,.35); }
/* the cloud's empty plate sits at ~9–90% × 53–87% of the picture */
.hero-row{ position:absolute; left:14%; right:13%; top:55.5%; bottom:15%; display:flex; align-items:center; justify-content:center; gap:calc(3.5cqw * var(--k,1));
  --text:#2b2450; --text-2:#6c6883; --line:rgba(60,48,110,.12); --glass-strong:rgba(255,255,255,.82);
  --accent-text:color-mix(in srgb,var(--accent) 70%,#2b2450); color:var(--text); }
.hero-row .ring{ flex:none; width:calc(30cqw * var(--k,1)); height:calc(30cqw * var(--k,1)); box-shadow:0 10px 22px -10px rgba(60,40,150,.4), 0 0 0 calc(1.2cqw * var(--k,1)) rgba(255,255,255,.55); }
.hero-row .ring svg{ inset:calc(1.4cqw * var(--k,1)); width:calc(100% - calc(2.8cqw * var(--k,1))); height:calc(100% - calc(2.8cqw * var(--k,1))); }
.hero-row .ring .center b{ font-size:calc(6.4cqw * var(--k,1)); white-space:nowrap; }
/* v0.7.1: timer shrinks with its length so it always stays inside the white circle */
.ring .center b{ white-space:nowrap; }
.ring .center b[data-len="5"]{ font-size:30px; }
.ring .center b[data-len="6"]{ font-size:28px; }
.ring .center b[data-len="7"]{ font-size:25px; }
.ring .center b[data-len="8"]{ font-size:21px; }
.ring .center b[data-len="9"], .ring .center b[data-len="10"]{ font-size:18px; }
.hero-row .ring .center b[data-len="5"]{ font-size:calc(5.9cqw * var(--k,1)); }
.hero-row .ring .center b[data-len="6"]{ font-size:calc(5.6cqw * var(--k,1)); }
.hero-row .ring .center b[data-len="7"]{ font-size:calc(4.8cqw * var(--k,1)); }
.hero-row .ring .center b[data-len="8"]{ font-size:calc(4.1cqw * var(--k,1)); }
.hero-row .ring .center b[data-len="9"], .hero-row .ring .center b[data-len="10"]{ font-size:calc(3.6cqw * var(--k,1)); }
.hero-row .ring .center span{ font-size:calc(2.9cqw * var(--k,1)); }
/* v0.7.2: compact stack so the label stays inside the white circle too */
.ring .center span{ display:block; white-space:nowrap; line-height:1.1; }
.hero-row .ring .center b{ line-height:1.05; }
.hero-row .ring .center span{ margin-top:calc(.2cqw * var(--k,1)); }
/* v0.7.3: the number sits exactly in the middle of the circle; icon hangs above it, label below */
.ring .center > div{ position:relative; }
.ring .center b{ line-height:1; }
.ring .center .ri{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin:0 0 3px; }
.ring .center b + span{ position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:3px; }
.hero-row .ring .center .ri{ margin-bottom:calc(.8cqw * var(--k,1)); }
.hero-row .ring .center b + span{ margin-top:calc(.9cqw * var(--k,1)); }
.ring .center b{ letter-spacing:0; }
.hero-row .ring .ri{ width:calc(4.6cqw * var(--k,1)); height:calc(4.6cqw * var(--k,1)); margin-bottom:calc(.2cqw * var(--k,1)); }
.hero-row .facts{ flex:1; min-width:0; grid-template-columns:1fr; grid-template-rows:auto 1px auto; gap:calc(2cqw * var(--k,1)); margin:0; padding:0; background:none; box-shadow:none; }
.hero-row .facts .sep{ width:auto; height:1px; background:rgba(60,48,110,.14); }
.hero-row .fact{ gap:calc(2cqw * var(--k,1)); align-items:center; }
.hero-row .fact .fi{ width:calc(5.4cqw * var(--k,1)); height:calc(5.4cqw * var(--k,1)); }
.hero-row .fact span{ font-size:calc(3.3cqw * var(--k,1)); color:#6c6883; }
.hero-row .fact b{ font-size:calc(5.6cqw * var(--k,1)); margin-top:0; line-height:1.1; }

/* v0.7.4: hero without the picture — ring + facts on the card, theme colours */
.hero-card.plain{ padding:16px 16px 16px; }
.hero-card.plain::before{ display:block; }
.hero-plain{ position:relative; container-type:inline-size; }
.hero-plain .hero-chip{ position:static; display:inline-flex; margin:0 0 10px; }
.hero-plain .hero-row{ position:relative; inset:auto; --k:1.28; gap:calc(5cqw); padding:2px 0 6px;
  --text:inherit; --text-2:inherit; --line:inherit; --glass-strong:inherit; --accent-text:inherit; }
.hero-plain .hero-row .ring{ box-shadow:0 12px 26px -12px var(--sh1), 0 0 0 calc(1.2cqw * 1.28) color-mix(in srgb,var(--glass-strong) 60%,transparent); }
.hero-plain .hero-row .fact span{ color:var(--text-2); }
.hero-plain .hero-row .facts .sep{ background:var(--line); }

/* v0.7.5: owl lives in the timer card, its words float in a cloud above the card */
.hero-card.plain{ overflow:visible; margin-top:80px; padding-top:10px; }
.hero-card.plain::before{ border-radius:inherit; }
.hero-owl{ position:relative; z-index:3; display:flex; align-items:flex-end; gap:22px; margin:-80px 10px 6px -6px; }
.hero-owl .owl{ width:76px; height:82px; margin:0 0 -2px; }
/* v0.7.6: a real puffy cloud — round body + bumps along every edge, one soft shadow over the whole silhouette */
.owl-say.cloud{ --cloud:color-mix(in srgb, var(--surface) 92%, var(--accent) 8%);
  isolation:isolate; background:var(--cloud); border-radius:46px; padding:14px 20px 12px; margin:14px 0 22px; box-shadow:none;
  filter:drop-shadow(0 10px 16px var(--sh1)) drop-shadow(0 1px 1px var(--sh2)); }
.owl-say.cloud .puffs{ position:absolute; inset:0; z-index:-1; pointer-events:none; }
.owl-say.cloud .puffs i{ position:absolute; border-radius:50%; background:var(--cloud); }
.owl-say.cloud .puffs i:nth-child(1){ width:46px; height:46px; left:4%;  top:-14px; }
.owl-say.cloud .puffs i:nth-child(2){ width:64px; height:64px; left:20%; top:-26px; }
.owl-say.cloud .puffs i:nth-child(3){ width:52px; height:52px; left:43%; top:-20px; }
.owl-say.cloud .puffs i:nth-child(4){ width:60px; height:60px; left:62%; top:-24px; }
.owl-say.cloud .puffs i:nth-child(5){ width:42px; height:42px; right:2%; top:-10px; }
.owl-say.cloud .puffs i:nth-child(6){ width:44px; height:44px; left:12%; bottom:-14px; }
.owl-say.cloud .puffs i:nth-child(7){ width:50px; height:50px; left:38%; bottom:-18px; }
.owl-say.cloud .puffs i:nth-child(8){ width:44px; height:44px; left:64%; bottom:-14px; }
.owl-say.cloud .puffs i:nth-child(9){ width:38px; height:38px; right:4%; bottom:-10px; }
.owl-say.cloud .puffs i:nth-child(10){ width:48px; height:48px; left:-12px; top:calc(50% - 24px); }
.owl-say.cloud .puffs i:nth-child(11){ width:48px; height:48px; right:-12px; top:calc(50% - 24px); }
/* thought bubbles drifting down to the owl */
.owl-say.cloud::before{ content:""; position:absolute; z-index:-1; left:-16px; bottom:-8px; width:15px; height:15px; border-radius:50%; transform:none; clip-path:none; background:var(--cloud);
  box-shadow:-12px 9px 0 -4px var(--cloud); }
.owl-say.cloud::after{ content:none; }
.owl-say:not(.cloud) .puffs{ display:none; }
.owl-say.cloud b{ font-size:14px; }
.owl-say.cloud span{ font-size:13px; margin-top:2px; }
.owl-say.cloud em{ margin-top:6px; font-size:11.5px; }

/* owl mascot «Сплюшка» (v0.7) */
.owl-card{ display:flex; align-items:flex-end; gap:6px; padding:10px 12px 10px 4px; overflow:visible; }
.owl{ flex:none; width:100px; height:106px; margin:0 -4px -6px 0; align-self:flex-end; cursor:pointer; background:none; border:0; padding:0; transform-origin:50% 100%; }
.owl svg{ width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 8px 12px rgba(108,84,200,.25)); }
html.dark .owl svg{ filter:drop-shadow(0 8px 12px rgba(0,0,0,.4)); }
.owl .ow-eyes{ transform-box:fill-box; transform-origin:center; animation:owlBlink 5.2s infinite; }
.owl .ow-pup{ transition:transform .35s cubic-bezier(.3,1.4,.5,1); }
.owl.look .ow-pup{ transform:translate(2.5px,-1.5px); }
.owl .ow-body{ transform-box:view-box; transform-origin:60px 112px; animation:owlBreath 4s ease-in-out infinite; }
.owl.hop{ animation:owlHop .6s cubic-bezier(.3,1.5,.5,1); }
.owl .ow-z{ font:800 13px var(--font-stack); fill:var(--accent-text); opacity:0; animation:owlZ 3s ease-in-out infinite; }
.owl .ow-z.z2{ animation-delay:1.5s; font-size:10px; }
@keyframes owlBlink{ 0%,90%,100%{ transform:scaleY(1); } 93%{ transform:scaleY(.08); } 96%{ transform:scaleY(1); } }
@keyframes owlBreath{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.015,.985); } }
@keyframes owlHop{ 0%{ transform:none; } 30%{ transform:translateY(-10px) rotate(-6deg) scale(1.04,.96); } 60%{ transform:translateY(0) rotate(3deg) scale(.97,1.03); } 100%{ transform:none; } }
@keyframes owlZ{ 0%{ opacity:0; transform:translate(0,0); } 25%{ opacity:1; } 100%{ opacity:0; transform:translate(10px,-18px); } }
.owl-say{ position:relative; flex:1; min-width:0; text-align:left; border:0; cursor:pointer; padding:11px 13px 9px; border-radius:22px 22px 22px 8px;
  background:var(--glass-strong); box-shadow:0 10px 24px -14px var(--sh1), inset 0 0 0 1px var(--line); color:var(--text); margin-bottom:4px; }
.owl-say::before{ content:""; position:absolute; left:-7px; bottom:10px; width:14px; height:14px; background:inherit; border-radius:3px 0 6px 0; transform:rotate(45deg) skew(8deg,8deg); box-shadow:inset 1px -1px 0 var(--line); clip-path:polygon(0 0,0 100%,100% 100%); }
.owl-say b{ display:block; font-size:15px; font-weight:800; line-height:1.25; }
.owl-say span{ display:block; margin-top:3px; font-size:13.5px; line-height:1.35; color:var(--text-2); font-weight:600; }
.owl-say em{ display:flex; justify-content:space-between; align-items:center; gap:8px; white-space:nowrap; margin-top:8px; font-style:normal; font-size:12px; font-weight:800; color:var(--accent-text); }
.owl-say em i{ font-style:normal; color:var(--text-2); font-weight:700; opacity:.8; }
.owl-say.pop{ animation:sayPop .45s cubic-bezier(.3,1.4,.5,1); }
@keyframes sayPop{ 0%{ transform:scale(.94); opacity:.4; } 100%{ transform:none; opacity:1; } }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

/* perf: cards inside the swiping pages don't re-blur the backdrop every frame (that made tab switches stutter) */
.view .glass, .view .hero-chip{ -webkit-backdrop-filter:none; backdrop-filter:none; }
.view .glass{ background:linear-gradient(180deg, var(--hl-soft), transparent 40%), color-mix(in srgb, var(--glass) 78%, var(--surface)); }
.view{ contain:layout paint; }
html.paging .blob, html.paging .sky .st{ animation-play-state:paused; }
</style>

<style>

function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); if (!y || !m || !d) return null; return new Date(y, m - 1, d); }
function ageParts(birthStr, now = new Date()) {
  const b = parseDate(birthStr); if (!b) return null;
  let years = now.getFullYear() - b.getFullYear(), months = now.getMonth() - b.getMonth(), days = now.getDate() - b.getDate();
  if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (months < 0) { years--; months += 12; }
  const totalDays = Math.round((startOfDay(now.getTime()) - b.getTime()) / DAY);
  const totalMonths = years * 12 + months;
  const nextMonth = new Date(b.getFullYear(), b.getMonth() + totalMonths + 1, b.getDate());
  const toNext = Math.round((nextMonth.getTime() - startOfDay(now.getTime())) / DAY);
  return { years, months, days, totalDays, weeks: Math.floor(totalDays / 7), totalMonths, toNext, nextMonthN: totalMonths + 1 };
}

  if (a.months) p.push(`${a.months} ${plural(a.months, "місяць", "місяці", "місяців")}`);

function analyze(now = Date.now()) {

    const base = norm ? ((norm.nap[count] || [])[i] || 60) : 60;
    const vals = sameDays.map(d => d.naps[i] && d.naps[i].len).filter(v => v && v > 10);
    return vals.length >= 2 ? base * 0.4 + mean(vals) * 0.6 : base;
  }
  const nights = days.filter(d => d.night && now - d.wake < 10 * DAY).map(d => (d.night.end - d.night.start) / MIN).filter(v => v > 240);
  const nightLen = nights.length >= 2 ? mean(nights.slice(-7)) : (norm ? mean(norm.night) * 60 : 660);

  // current day
  const last = days[days.length - 1];
  let today = null;
  if (last && now - last.wake < 20 * HOUR && !last.complete) today = last;
  const lastDone = done[done.length - 1] || null;
  let napsToday;
  if (today) napsToday = today.naps.map(n => n.s);
  else { const since = startOfDay(now) + 5 * HOUR; napsToday = done.filter(s => s.kind !== "night" && s.start >= since); }
  const lastEnd = lastDone && now - lastDone.end < 14 * HOUR ? lastDone.end : null;

  // plan for rest of day
  let plan = [];
  if (!ongoing && lastEnd && norm && !(lastDone.kind === "night" && minutesOfDay(lastDone.end) < 240 && minutesOfDay(now) < 300)) {
    let t = lastEnd, idx = napsToday.length;
    const lastWasShort = lastDone.kind !== "night" && (lastDone.end - lastDone.start) / MIN < 40;
    for (let i = idx; i <= Math.max(count, idx); i++) {
      let w = wwFor(Math.min(i, count));
      if (i === idx && lastWasShort) w = Math.max(w * 0.8, w - 30);
      const start = t + w * MIN;
      if (i < count) { plan.push({ type: "nap", n: i + 1, start, w }); t = start + napLen(i) * MIN; }
      else { plan.push({ type: "bed", start, w }); break; }
    }
  }
  let expectedWake = null;
  if (ongoing) {
    const idx = napsToday.length;
    expectedWake = ongoing.start + (ongoing.kind === "night" ? nightLen : napLen(Math.min(idx, Math.max(0, count - 1)))) * MIN;
  }
  const daySleep = napsToday.reduce((a, s) => a + (s.end - s.start), 0);
  const lastNight = today && today.night ? today.night.end - today.night.start : null;
  return { ageM, norm, count, ongoing, done, days, recent, today, napsToday, lastEnd, lastDone, plan, expectedWake, daySleep, lastNight, personalDays, nightLen, napLen, wwFor };
}

function evaluateTransition(A) {
  if (!A.norm || A.ageM == null) return null;
  const tr = TRANSITIONS.find(t => t.from === A.count && A.ageM >= t.range[0] - 1.5) || TRANSITIONS.find(t => t.from === A.count);
  const recent = A.recent;
  const enough = recent.length >= 3;
  const struggle = A.done.filter(s => s.struggle && Date.now() - s.start < 7 * DAY && s.kind !== "night").length;
  const signs = [];
  if (tr) {
    const k = tr.from;
    const skipped = recent.filter(d => d.naps.length < k).length;
    const lastNapLens = recent.filter(d => d.naps.length >= k).map(d => d.naps[k - 1].len);
    const bedMins = recent.map(d => minutesOfDay(d.bed)).map(m => m < 240 ? m + 1440 : m);
    const wakeMins = recent.map(d => minutesOfDay(d.wake));
    signs.push({ t: `Останній (${k}-й) сон пропускається`, yes: skipped >= 2, d: enough ? `${skipped} з ${recent.length} днів` : null });
    if (k > 0) signs.push({ t: `Останній сон короткий, менше 45 хв`, yes: lastNapLens.length >= 3 && mean(lastNapLens) < 45, d: lastNapLens.length ? `в середньому ${fmtDur(mean(lastNapLens) * MIN)}` : null });
    signs.push({ t: "Довго засинає вдень (позначка в записах)", yes: struggle >= 2, d: `${struggle} за тиждень` });
    signs.push({ t: "Відбій зсувається пізніше 20:30", yes: bedMins.length >= 3 && mean(bedMins) > 20.5 * 60, d: bedMins.length ? `в середньому ${hm(mean(bedMins))}` : null });
    signs.push({ t: "Ранні пробудження, до 6:00", yes: wakeMins.filter(m => m < 360).length >= 3, d: wakeMins.length ? `${wakeMins.filter(m => m < 360).length} з ${wakeMins.length} ранків` : null });
    if (k === 2) {
      const n1 = recent.filter(d => d.naps.length >= 2).map(d => d.naps[0].len), n2 = recent.filter(d => d.naps.length >= 2).map(d => d.naps[1].len);
      signs.push({ t: "Перший сон довгий, а другий короткий", yes: n1.length >= 3 && mean(n1) >= 90 && mean(n2) < 50, d: n1.length ? `${fmtDur(mean(n1) * MIN)} / ${fmtDur(mean(n2) * MIN)}` : null });
    }
  }
  const yes = signs.filter(s => s.yes).length;
  let level, title, text;
  const ageTxt = `${Math.floor(A.ageM)} міс`;
  if (!tr) { level = "ok"; title = "Переходів зараз не очікується"; text = `У ${ageTxt} поточна кількість снів типова.`; }
  else if (A.ageM < tr.range[0]) { level = "ok"; title = `Поки ${A.count} ${plural(A.count, "сон", "сни", "снів")} вдень`; text = `Перехід ${tr.from}→${tr.to} зазвичай буває у ${tr.range[0]}–${tr.range[1]} міс. Ще рано, якщо немає явних ознак.`; }
  else if (!enough) { level = "info"; title = `Вік для переходу ${tr.from}→${tr.to}`; text = `У ${ageTxt} багато дітей поступово переходять з ${tr.from} на ${tr.to}. Щоб оцінити ознаки, потрібно хоча б 3 повні дні записів (від ранкового пробудження до нічного сну).`; }
  else if (yes >= 2) { level = "warn"; title = `Схоже, готується перехід ${tr.from}→${tr.to}`; text = `Помітно ${yes} ${plural(yes, "ознаку", "ознаки", "ознак")} з ${signs.length}. Якщо вони тримаються 1–2 тижні, можна починати перехід.`; }
  else if (yes === 1) { level = "info"; title = "Варто поспостерігати"; text = `Є одна ознака переходу ${tr.from}→${tr.to}. Одного сигналу мало: подивіться, чи вона повторюється кілька днів.`; }
  else { level = "ok"; title = `${A.count} ${plural(A.count, "сон", "сни", "снів")} вдень поки підходять`; text = `Ознак переходу ${tr.from}→${tr.to} не видно. Тримайте поточний режим.`; }

  // under-sleeping check (maybe too few naps)
  let under = null;
  if (enough && A.norm) {
    const avgDay = mean(A.recent.map(d => d.naps.reduce((a, n) => a + n.len, 0))) / 60;
    if (avgDay < A.norm.day[0] - 0.4 && A.count < A.norm.primary) under = `Денного сну в середньому ${avgDay.toFixed(1).replace(".", ",")} год, а для віку типово ${A.norm.day[0]}–${A.norm.day[1]} год. Можливо, варто повернути ще один сон на кілька днів.`;
  }
  return { tr, signs, yes, level, title, text, under, enough };
}

/* ============ rendering ============ */
const g = () => (state.child && state.child.gender) || "";
const verb = (m, f, n) => g() === "m" ? m : g() === "f" ? f : n;
function greeting() { const h = new Date().getHours(); return h < 5 ? "Доброї ночі" : h < 11 ? "Доброго ранку" : h < 17 ? "Добрий день" : h < 22 ? "Добрий вечір" : "Доброї ночі"; }
function defaultKind(ms = Date.now()) { const m = minutesOfDay(ms); return (m >= 18 * 60 + 30 || m < 5 * 60) ? "night" : "nap"; }
let heroKind = null;

function topBar(title, sub) {
  const photo = state.child && isImgData(state.child.photo) ? state.child.photo : null;
  const initial = photo ? `<img src="${esc(photo)}" alt="">` : state.child && state.child.name ? esc(state.child.name.trim()[0].toUpperCase()) : "?";
  return `<div class="top">
    <div class="titles"><div class="hello">${sub}</div><h1 class="big-title">${title}</h1></div>
    <button class="icon-btn glass" data-act="theme" aria-label="Змінити тему" title="Світла або темна тема">${isDark() ? ICON.sun : ICON.moon}</button>
    <button class="icon-btn avatar" data-act="profile" aria-label="Профіль і налаштування">${initial}<i class="sync-dot ${state.sync}"></i></button>
  </div>`;
}

function fitRings() { $$(".ring .center b").forEach(b => { const n = String(b.textContent.trim().length); if (b.dataset.len !== n) b.dataset.len = n; }); }
function renderHome() {
  const el = $("#view-home");
  if (document.activeElement && el.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  if (!state.loaded) { el.innerHTML = `<div class="wrap">${topBar("Сплюшка", greeting())}<div class="card glass loading"><div class="spinner"></div><div class="muted">Підключаємося до спільних записів…</div></div></div>`; return; }
  const c = state.child;
  if (!c || !c.birth) {
    el.innerHTML = `<div class="wrap">${topBar("Сплюшка", greeting())}${syncBanner()}
      <div class="card glass">
        <h2 style="font-size:22px">Почнімо знайомство</h2>
        <p class="muted" style="margin:6px 0 16px">Імʼя та дата народження потрібні, щоб рахувати вік і підбирати вікна неспання.</p>
        <form class="form" id="onbForm">
          <div class="field"><label for="onbName">Імʼя дитини</label><input class="input" id="onbName" required maxlength="40" placeholder="Наприклад, Соломія"></div>
          <div class="field"><label for="onbBirth">Дата народження</label><input class="input" id="onbBirth" type="date" required max="${toLocalInput(Date.now()).slice(0, 10)}"></div>
          <div class="field"><label>Стать (для звертань)</label><div class="seg" id="onbGender"><span class="pill"></span><button type="button" data-v="m">Хлопчик</button><button type="button" data-v="f">Дівчинка</button><button type="button" data-v="" class="on">Не вказувати</button></div></div>
          <button class="btn" type="submit" style="margin-top:4px">Зберегти</button>
        </form>
      </div></div>`;
    initSeg($("#onbGender"));
    $("#onbForm").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("#onbName").value.trim(), birth = $("#onbBirth").value;
      if (!name || !birth) return;
      const gender = ($("#onbGender .on") || {}).dataset?.v || "";
      try { document.activeElement.blur(); await store.setChild({ name, birth, gender, preterm: 0 }); toast("Профіль збережено"); } catch (e) { }
    });
    return;
  }
  const A = analyze();
  const age = ageParts(c.birth);
  const now = Date.now();
  const name = esc(c.name);

  // hero
  let hero;
  if (A.ongoing) {
    const len = A.expectedWake - A.ongoing.start;
    hero = `<div class="card glass hero-card plain">
      ${owlRow(A, c.name)}<div class="hero-plain">
      <div class="hero-row">
        ${ring("asleep", A.ongoing.start, len, `<b class="num" data-since="${A.ongoing.start}">${fmtClock(now - A.ongoing.start)}</b><span>спить</span>`)}
        <div class="facts">
          <div class="fact"><span class="fi">${ICON.bed}</span><div><span>${A.ongoing.kind === "night" ? "Нічний сон з" : "Денний сон з"}</span><b class="num">${fmtTime(A.ongoing.start)}</b></div></div>
          <i class="sep"></i>
          <div class="fact"><span class="fi">${ICON.alarm}</span><div><span>Прокинеться ~</span><b class="num">${fmtTime(A.expectedWake)}</b></div></div>
        </div>
      </div></div>
      <button class="main-btn wake" data-act="wake">${ICON.sun}${verb("Прокинувся", "Прокинулась", "Прокинувся(лась)")}</button>
    </div>`;
  } else {
    const k = heroKind || defaultKind();
    const next = A.plan[0];
    const awakeTxt = A.lastEnd ? `<b class="num" data-since="${A.lastEnd}">${fmtClock(now - A.lastEnd)}</b><span>не спить</span>` : `<b>—</b><span>не спить</span>`;
    const winLen = next ? next.w * MIN : 0;
    hero = `<div class="card glass hero-card plain">
      ${owlRow(A, c.name)}<div class="hero-plain">
      <div class="hero-row">
        ${ring("", A.lastEnd || now, winLen, awakeTxt)}
        <div class="facts">
          <div class="fact"><span class="fi">${ICON.sun}</span><div><span>${A.lastEnd ? verb("Прокинувся", "Прокинулась", "Прокинувся(лась)") + " о" : "Немає записів"}</span><b class="num">${A.lastEnd ? fmtTime(A.lastEnd) : "—"}</b></div></div>
          <i class="sep"></i>
          <div class="fact"><span class="fi">${ICON.moon}</span><div><span>${next ? (next.type === "bed" ? "Відбій ~" : "Наступний сон") : "Ще немає прогнозу"}</span><b class="num">${next ? fmtTime(next.start) : "—"}</b></div></div>
        </div>
      </div></div>
      <div class="seg kind-row" id="heroKind"><span class="pill"></span><button data-v="nap" class="${k === "nap" ? "on" : ""}">Денний сон</button><button data-v="night" class="${k === "night" ? "on" : ""}">Нічний сон</button></div>
      <button class="main-btn" data-act="sleep">${ICON.moon}${verb("Заснув", "Заснула", "Заснув(ла)")}</button>
    </div>`;
  }

  // prediction
  let pred;
  if (A.ongoing) {
    const after = (() => { if (A.ongoing.kind === "night") return ""; return `<div class="muted small" style="margin-top:8px">Після пробудження застосунок порахує наступне вікно.</div>`; })();
    pred = `<div class="card glass"><div class="card-head"><h2 class="ht"><span class="hi">${ICON.alarm}</span>Прогноз</h2><span class="chip night">спить</span></div>
      <div class="pred-grid"><div><div class="muted small">Прокинеться приблизно о</div><div class="pred-time num">${fmtTime(A.expectedWake)}</div></div>
      <div class="muted small" style="text-align:right">${A.ongoing.kind === "night" ? `середня ніч ${fmtDur(A.nightLen * MIN)}` : ""}</div></div>${after}</div>`;
  } else if (A.plan.length && A.plan[0].start - now > -2 * HOUR) {
    const n = A.plan[0];
    const diff = n.start - now;
    const late = diff < -20 * MIN;
    const label = n.type === "bed" ? "Відбій" : `Сон №${n.n}`;
    const basis = A.personalDays >= 2 ? `за вашими записами (${A.personalDays} ${plural(A.personalDays, "день", "дні", "днів")}) і нормами віку` : "за нормами віку; з записами прогноз стане точнішим";
    pred = `<div class="card glass"><div class="card-head"><h2 class="ht"><span class="hi">${ICON.alarm}</span>Наступний сон</h2><span class="chip ${late ? "warn" : ""}">${label}</span></div>
      <div class="pred-grid"><div><div class="muted small">Оптимально ${fmtTime(n.start - 15 * MIN)}–${fmtTime(n.start + 15 * MIN)}</div><div class="pred-time num">${fmtTime(n.start)}</div></div>
      <div style="text-align:right"><div class="muted small">${late ? "вікно минуло" : diff > 0 ? "через" : "вже час"}</div><div style="font-size:20px;font-weight:800" class="num" ${diff > 0 ? `data-until="${n.start}"` : ""}>${diff > 0 ? fmtClock(diff) : late ? "−" + fmtDur(-diff) : "зараз"}</div></div></div>
      ${late ? `<div class="banner" style="background:rgba(233,162,59,.14);margin-top:12px">Вікно неспання вже минуло. Якщо малюк спав, а запису немає, додайте його в журналі.</div>` : ""}
      ${A.plan.length > 1 ? `<div class="plan-list">${A.plan.slice(1).map(p => `<div class="plan-row"><span class="muted">${p.type === "bed" ? "Відбій" : "Сон №" + p.n}</span><b class="num">~ ${fmtTime(p.start)}</b></div>`).join("")}</div>` : ""}
      <div class="muted small" style="margin-top:10px">Вікно ${fmtDur(n.w * MIN)}, ${basis}.</div></div>`;
  } else {
    pred = `<div class="card glass"><div class="card-head"><h2>Наступний сон</h2></div>
      <p class="muted" style="margin:0">Щоб побачити прогноз, запишіть, коли ${verb("малюк прокинувся", "малеча прокинулась", "малюк прокинувся")} зранку, або останній сон.</p>
      ${A.norm ? `<div class="plan-list"><div class="plan-row"><span class="muted">Типово для віку</span><b>${A.norm.primary} ${plural(A.norm.primary, "сон", "сни", "снів")}</b></div><div class="plan-row"><span class="muted">Вікна неспання</span><b>${fmtDur(A.norm.ww[A.norm.primary][0] * MIN)} – ${fmtDur(A.norm.ww[A.norm.primary].slice(-1)[0] * MIN)}</b></div></div>` : ""}</div>`;
  }

  // today
  const dayStart = startOfDay(now);
  const segs = segmentsFor(dayStart, dayStart + DAY, now);
  const predSeg = !A.ongoing && A.plan[0] && A.plan[0].type === "nap" ? (() => { const s = A.plan[0].start, e = s + A.napLen(A.plan[0].n - 1) * MIN; if (s > dayStart + DAY) return ""; return `<i class="pred" style="left:${pct(s - dayStart)}%;width:${pct(Math.min(e, dayStart + DAY) - s)}%"></i>`; })() : "";
  const nowPct = pct(now - dayStart);
  const todayCard = `<div class="card glass"><div class="card-head"><h2 class="ht"><span class="hi">${ICON.chart}</span>Режим дня</h2><span class="muted small">Сьогодні · ${A.napsToday.length} ${plural(A.napsToday.length, "денний сон", "денні сни", "денних снів")}</span></div>
    <div class="tl-wrap"><div class="tl">${segs}${predSeg}</div><span class="now-mark" style="left:${nowPct}%"><em class="num" style="${nowPct < 8 ? "transform:translateX(-12%)" : nowPct > 92 ? "transform:translateX(-88%)" : ""}">${fmtTime(now)}</em></span></div>
    <div class="tl-axis num"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    <div class="legend"><span><i style="background:var(--night)"></i>нічний сон</span><span><i style="background:var(--nap)"></i>денний сон</span><span><i style="background:var(--accent)"></i>прогноз</span></div></div>
    <div class="tiles">
      <div class="tile glass"><span class="ti">${ICON.sun}</span><b class="num">${fmtDur(A.daySleep)}</b><span>денний сон</span></div>
      <div class="tile glass"><span class="ti">${ICON.moon}</span><b class="num">${A.lastNight ? fmtDur(A.lastNight) : "—"}</b><span>минула ніч</span></div>
      <div class="tile glass"><span class="ti">${ICON.clock}</span><b class="num">${A.norm ? `${A.norm.day[0]}–${A.norm.day[1]} год` : "—"}</b><span>норма вдень</span></div>
    </div>`;

  // hint
  const T = evaluateTransition(A);
  const hint = T ? `<button class="card glass hint" data-act="tips">
      <span class="ico">${ICON.bulb}</span>
      <span><h3>${esc(T.title)}</h3><span class="muted small">${esc(T.under || T.text)}</span></span></button>` : "";

  // age
  const ageCard = `<div class="card glass"><div class="card-head"><h2>Вік</h2><span class="chip">${age.totalMonths} міс</span></div>
    <div class="age-main">${ageText(age)}</div>
    <div class="age-sub"><span class="chip num">${age.totalDays} ${plural(age.totalDays, "день", "дні", "днів")}</span><span class="chip num">${age.weeks} ${plural(age.weeks, "тиждень", "тижні", "тижнів")}</span><span class="chip nap num">${age.nextMonthN} міс через ${age.toNext} ${plural(age.toNext, "день", "дні", "днів")}</span></div>
    ${c.preterm ? `<div class="muted small" style="margin-top:8px">Прогнози враховують скоригований вік (народження на ${c.preterm} ${plural(c.preterm, "тиждень", "тижні", "тижнів")} раніше).</div>` : ""}</div>`;

  el.innerHTML = `<div class="wrap">${topBar(name, `${greeting()} · ${ageShort(age)}`)}${syncBanner()}${hero}${todayCard}${hint}</div>`;
  const hk = $("#heroKind"); if (hk) initSeg(hk, v => { heroKind = v; });

function ring(cls, start, len, inner) {
  const R = 48, C = 2 * Math.PI * R;
  const p = len > 0 ? clamp((Date.now() - start) / len, 0, 1) : 0;
  const late = len > 0 && Date.now() - start > len && cls !== "asleep";
  return `<div class="ring ${cls} ${late ? "late" : ""}" ${len > 0 ? `data-ring-start="${start}" data-ring-len="${len}"` : ""}><svg viewBox="0 0 112 112"><circle class="track" cx="56" cy="56" r="${R}" fill="none" stroke-width="10"/><circle class="bar" cx="56" cy="56" r="${R}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg><div class="center"><div>${inner}</div></div></div>`;
}
const pct = ms => clamp(ms / DAY * 100, 0, 100);
function segmentsFor(from, to, now = Date.now()) {
  return state.sleeps.filter(s => (s.end || now) > from && s.start < to).map(s => {
    const a = Math.max(s.start, from), b = Math.min(s.end || now, to);
    return `<i class="${s.kind === "night" ? "night" : "nap"}" style="left:${pct(a - from)}%;width:${Math.max(0.6, pct(b - a))}%"></i>`;
  }).join("");
}
function syncBanner() {
  if (store.mode === "local" && state.sync === "local") return `<div class="banner glass">Синхронізація недоступна в цьому перегляді, тому записи зберігаються лише на цьому пристрої.</div>`;
  if (state.sync === "slow") return `<div class="banner glass">Не вдається зʼєднатися зі спільною базою. Дані можуть бути неактуальні.</div>`;
  if (state.sync === "error") return `<div class="banner glass">Спільні записи зараз недоступні. Спробуйте відкрити застосунок пізніше.</div>`;
  return "";
}

function renderSleep() {

  el.innerHTML = `<div class="wrap">${topBar("Сон", state.child ? esc(state.child.name) : "Журнал, звуки й поради")}${segHtml}${body}</div>`;
