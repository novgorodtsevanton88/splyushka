function logHtml() {
  if (!state.loaded) return `<div class="card glass loading"><div class="spinner"></div><div class="muted">Завантаження…</div></div>`;
  const now = Date.now(), today = startOfDay(now);
  const rows = [], MK = milesByDay(), seenMk = [];
  for (let i = 6; i >= 0; i--) {
    const from = today - i * DAY, to = from + DAY, mks = MK[dayKey(from)] || [];
    mks.forEach(m => seenMk.push(m));
    const tot = state.sleeps.filter(s => (s.end || now) > from && s.start < to).reduce((a, s) => a + (Math.min(s.end || now, to) - Math.max(s.start, from)), 0);
    const d = new Date(from);
    rows.push(`<div class="wk-row ${mks.length ? "has-mk" : ""}"><span class="dl">${DOW[d.getDay()]} ${d.getDate()}${mks.length ? `<b class="mk" data-mk="${dayKey(from)}">${mks.slice(0, 2).map(m => m.e).join("")}</b>` : ""}</span><div class="tl">${segmentsFor(from, to, now)}</div><span class="tot num">${tot ? Math.floor(Math.round(tot / MIN) / 60) + ":" + pad(Math.round(tot / MIN) % 60) : "—"}</span></div>`);
  }
  const A = analyze();
  const avgDay = A.recent.length ? mean(A.recent.map(d => d.naps.reduce((a, n) => a + n.len, 0))) : null;
  const avgNight = A.recent.length ? mean(A.recent.filter(d => d.night).map(d => (d.night.end - d.night.start) / MIN)) : null;
  const avgNaps = A.recent.length ? mean(A.recent.map(d => d.naps.length)) : null;
  const week = `<div class="card glass"><div class="card-head"><h2>Тиждень</h2><div class="btn-row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="mile">★ Подія</button><button class="btn sm" data-act="add">+ Сон</button></div></div>
    <div class="week">${rows.join("")}</div>
    <div class="legend"><span><i style="background:var(--nap)"></i>денний</span><span><i style="background:var(--night)"></i>нічний</span></div>
    ${seenMk.length ? `<div class="mk-list">${seenMk.map(m => `<span class="chip">${m.e} ${esc(m.label)} · ${fmtDayKey(m.d)}</span>`).join("")}</div>` : ""}
    <div class="stats"><div class="stat"><b class="num">${avgDay != null ? fmtDur(avgDay * MIN) : "—"}</b><span>вдень, сер.</span></div><div class="stat"><b class="num">${avgNight ? fmtDur(avgNight * MIN) : "—"}</b><span>ніч, сер.</span></div><div class="stat"><b class="num">${avgNaps != null ? avgNaps.toFixed(1).replace(".", ",") : "—"}</b><span>снів на день</span></div></div>
  </div>`;
  if (!state.sleeps.length) return week + `<div class="card glass" style="text-align:center"><h2>Записів ще немає</h2><p class="muted">Почніть із кнопки на головній або додайте сон вручну.</p></div>`;
  const groups = new Map();
  state.sleeps.slice(0, 120).forEach(s => { const k = startOfDay(s.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
  const list = Array.from(groups.entries()).map(([k, arr]) => `<div class="day-group"><h3>${dayTitle(k)}</h3>${arr.map(s => `
    <button class="entry glass" data-edit="${esc(s.id)}">
      <span class="dot ${s.kind === "night" ? "night" : "nap"}">${s.kind === "night" ? ICON.moon : ICON.sun}</span>
      <span class="info"><span class="t num">${fmtTime(s.start)} – ${s.end ? fmtTime(s.end) : "зараз"}</span><span class="s">${s.kind === "night" ? "Нічний сон" : "Денний сон"}${s.struggle ? " · довго засинав(ла)" : ""}${s.note ? " · " + esc(s.note) : ""}</span></span>
      <span class="d num">${s.end ? fmtDur(s.end - s.start) : `<span data-since="${s.start}">${fmtClock(Date.now() - s.start)}</span>`}</span>
    </button>`).join("")}</div>`).join("");
  return week + list;
}

      ${T.under ? `<div class="banner" style="background:rgba(233,162,59,.14);margin-top:10px">${esc(T.under)}</div>` : ""}

}

const ANIMAL_PIC_IDS = new Set(["cow", "dog", "cat", "pig", "hen", "rooster", "horse", "sheep", "duck", "goat", "frog", "bird"]);

  ["squirrel", /^біл[коч]/, "🐿"], ["chick", /^(курч|ципл|ціпл|ципо|ціпо|пташен)/, "🐤🐥🐣"], ["wolf", /^вов[кч]/, "🐺"],
  ["bunny", /^(зай|крол|кріл)/, "🐰🐇"], ["hedgehog", /^їжа/, "🦔"], ["hamster", /^хом/, "🐹"],
];
function animalPicId(id) {
  if (ANIMAL_PIC_IDS.has(id)) return id;
  const z = (state.zoo || {})[id]; if (!z || !z.custom) return null;
  const n = String(z.n || "").toLowerCase().replace(/[ʼ'’`]/g, "").trim(), e = String(z.emo || "");
  const hit = EXTRA_PICS.find(([, re]) => re.test(n)) || (e && EXTRA_PICS.find(([, , em]) => [...em].some(c => c.length > 0 && e.includes(c))));
  return hit ? hit[0] : null;
}
function animalArt(id) {
  const c = state.animals.img[id]; if (c && isImgData(c.data)) return `<img src="${esc(c.data)}" alt="">`;
  const pic = animalPicId(id);
  if (pic) return `<img class="pic" src="img/animals/${pic}.webp" alt="" decoding="async" draggable="false">`;
  if (ANIMAL_SVG[id]) return ANIMAL_SVG[id];
  const z = (state.zoo || {})[id] || {}; return `<span class="emo">${esc(z.emo || ((z.n || "?").trim()[0] || "?").toUpperCase())}</span>`;
}

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return Math.abs(h); };

/* ---- play together: timer with auto-stop ---- */
const Together = { end: 0, dur: 0 };
const tgActive = () => Together.end > Date.now();
function tgStart(min) {
  Together.dur = min; Together.end = Date.now() + min * MIN; settings.playMin = min; LS.set("settings", settings);
  const o = $("#tg-end"); if (o) o.remove();
  tgChip(); renderDev(); toast(`Граємо разом ${min} хв. Далі гра сама зупиниться.`);
}
function tgStop(silent) {
  Together.end = 0; const c = $("#tg-chip"); if (c) c.remove(); renderDev(); if (!silent) toast("Гру зупинено");
}
function tgChip() {
  let c = $("#tg-chip");
  if (!tgActive()) { if (c) c.remove(); return; }
  if (!c) { c = document.createElement("div"); c.id = "tg-chip"; c.className = "glass"; c.innerHTML = `<span>⏱</span><b class="num" id="tgLeft"></b><button data-tg="stop" aria-label="Зупинити гру">${ICON.close}</button>`; document.body.appendChild(c); }
  tgTick();
}
function tgTick() {
  if (!Together.end) return;
  const left = Together.end - Date.now();
  if (left <= 0) { tgFinish(); return; }
  const t = fmtClock(left); $$("#tgLeft, [data-tgleft]").forEach(x => x.textContent = t);
}
function tgFinish() {
  Together.end = 0; const c = $("#tg-chip"); if (c) c.remove();
  stopClip(); closeStage(true); closeSheet(true);
  renderDev();

  const now = Date.now();
  const kind = s ? (s.kind || "nap") : defaultKind(now - HOUR);
  const start = s ? s.start : now - HOUR, end = s ? s.end : now;
  openSheet(`${sheetHead(s ? "Редагувати сон" : "Новий запис")}
    <form class="form" id="editForm">
      <div class="seg" id="edKind"><span class="pill"></span><button type="button" data-v="nap" class="${kind !== "night" ? "on" : ""}">Денний</button><button type="button" data-v="night" class="${kind === "night" ? "on" : ""}">Нічний</button></div>
      <div class="field"><label for="edStart">Заснув(ла)</label><input class="input" type="datetime-local" id="edStart" value="${toLocalInput(start)}" required></div>
      <div class="field"><label for="edEnd">Прокинувся(лась)</label><input class="input" type="datetime-local" id="edEnd" value="${end ? toLocalInput(end) : ""}" ${!end ? "disabled" : ""}></div>
      <div class="toggle-row"><span>Ще спить</span><button type="button" class="switch ${!end ? "on" : ""}" id="edOngoing" aria-label="Ще спить"></button></div>
      <div class="toggle-row"><span>Довго засинав(ла), понад 20 хв</span><button type="button" class="switch ${s && s.struggle ? "on" : ""}" id="edStruggle" aria-label="Довго засинав"></button></div>
      <div class="field"><label for="edNote">Нотатка</label><input class="input" id="edNote" maxlength="120" value="${esc(s && s.note || "")}" placeholder="Зубки, у візочку, після прогулянки…"></div>
      <div id="edErr" class="small" style="color:var(--danger);min-height:1em"></div>
      <button class="btn" type="submit">Зберегти</button>
      ${s ? `<button class="btn danger" type="button" id="edDel">Видалити запис</button>` : ""}
    </form>`, sh => {
    let k = kind;
    initSeg($("#edKind", sh), v => k = v);
    const ong = $("#edOngoing", sh), endI = $("#edEnd", sh), str = $("#edStruggle", sh);
    ong.addEventListener("click", () => { ong.classList.toggle("on"); endI.disabled = ong.classList.contains("on"); if (!endI.disabled && !endI.value) endI.value = toLocalInput(Date.now()); });
    str.addEventListener("click", () => str.classList.toggle("on"));
    $("#editForm", sh).addEventListener("submit", async e => {
      e.preventDefault();
      const st = fromLocalInput($("#edStart", sh).value), en = ong.classList.contains("on") ? null : fromLocalInput(endI.value);
      const err = $("#edErr", sh);
      if (!st) { err.textContent = "Вкажіть час засинання."; return; }
      if (st > Date.now() + MIN) { err.textContent = "Час засинання не може бути в майбутньому."; return; }
      if (en != null && en <= st) { err.textContent = "Пробудження має бути пізніше за засинання."; return; }
      if (en != null && en - st > 16 * HOUR) { err.textContent = "Сон довший за 16 год. Перевірте дату."; return; }
      const other = state.sleeps.find(x => !x.end && x.id !== (s && s.id));
      if (en == null && other) { err.textContent = "Вже є сон, що триває. Спочатку завершіть його."; return; }
      const o = { start: st, end: en, kind: k, note: $("#edNote", sh).value.trim(), struggle: str.classList.contains("on") };
      try { if (s) await store.updateSleep(s.id, o); else await store.addSleep(o); closeSheet(); toast("Збережено"); } catch (e) { }
    });
    const del = $("#edDel", sh);
    if (del) del.addEventListener("click", async () => {
      if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "Точно видалити?"; return; }
      try { await store.deleteSleep(s.id); closeSheet(); toast("Запис видалено"); } catch (e) { }
    });
  });
}

/* ============ резервна копія ============ */
const BK_WEEK = 7 * 24 * 3600 * 1000;
const BK_COLS = [["zoo", "zoo", "setZoo"], ["devDay", "devDays", "setDevDay"], ["skills", "skills", "setSkill"], ["known", "known", "setKnown"], ["words", "words", "setWord"], ["miles", "miles", "setMile"], ["lulls", "lulls", "setLull"]];
function bkLastText() {
  if (!settings.lastBackup) return "Копію ще не зберігали.";
  const d = new Date(settings.lastBackup), days = Math.floor((Date.now() - d) / 86400000);
  return "Остання копія: " + d.toLocaleDateString("uk-UA", { day: "numeric", month: "long" }) + (days > 0 ? " (" + days + " дн. тому)" : " (сьогодні)");
}
async function bkCollect() {
  let sleeps = state.sleeps;
  if (store.mode === "db") { try { const sn = await store.db.collection("sleeps").get(); sleeps = sn.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { } }
  const out = { app: "splyushka", v: 1, at: new Date().toISOString(), child: state.child || null, sleeps: sleeps.map(x => Object.assign({}, x)) };
  BK_COLS.forEach(([col, field]) => { out[col] = state[field] || {}; });
  return out;
}
async function bkSave() {
  let data;
  try { data = await bkCollect(); } catch (e) { toast("Не вдалося зібрати дані"); return false; }
  if (!data.child && !data.sleeps.length) { toast("Поки що немає що зберігати"); return false; }
  const name = "splyushka-" + new Date().toISOString().slice(0, 10) + ".json";
  const file = new File([JSON.stringify(data)], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Копія Сплюшки" });
    } else {
      const url = URL.createObjectURL(file), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (e) { if (e && e.name === "AbortError") return false; toast("Не вдалося зберегти файл"); return false; }
  settings.lastBackup = Date.now(); settings.backupSnooze = 0; LS.set("settings", settings);
  toast("Копію збережено"); bkHide();
  const l = $("#bkLast"); if (l) l.textContent = bkLastText();
  return true;
}
async function bkRestore(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast("Це не файл копії Сплюшки"); return; }
  if (!d || d.app !== "splyushka" || !Array.isArray(d.sleeps)) { toast("Це не файл копії Сплюшки"); return; }
  if (!confirm("Додати дані з копії? Наявні записи залишаться, відсутні буде відновлено.")) return;
  toast("Відновлюю…");
  try {
    if (d.child && !state.child) await store.setChild(d.child);
    const have = new Map(state.sleeps.map(x => [x.id, x]));
    const list = d.sleeps.filter(x => x && x.id && (!have.has(x.id) || JSON.stringify(have.get(x.id)) !== JSON.stringify(x)));
    if (store.mode === "db") {
      for (let i = 0; i < list.length; i += 20) await Promise.all(list.slice(i, i + 20).map(x => { const { id, ...rest } = x; return store.db.doc("sleeps/" + id).set(rest); }));
    } else if (list.length) {
      list.forEach(x => { const k = state.sleeps.findIndex(y => y.id === x.id); if (k >= 0) state.sleeps[k] = x; else state.sleeps.push(x); });
      state.sleeps.sort((a, b) => b.start - a.start); store.saveLocal();
    }
    let n = list.length;
    for (const [col, field, fn] of BK_COLS) {
      const src = d[col] || {}, cur = state[field] || {};
      const ids = Object.keys(src).filter(id => JSON.stringify(cur[id]) !== JSON.stringify(src[id]));
      for (let i = 0; i < ids.length; i += 20) await Promise.all(ids.slice(i, i + 20).map(id => store[fn](id, src[id])));
      n += ids.length;
    }
    toast(n ? "Відновлено записів: " + n : "Усе вже на місці");
  } catch (e) { toast("Не вдалося відновити частину даних"); }
}
function bkMount(sh) {
  const sw = $("#bkRemind", sh);
  sw.addEventListener("click", () => {
    settings.backupRemind = !settings.backupRemind; sw.classList.toggle("on", settings.backupRemind);
    if (settings.backupRemind && !settings.lastBackup) settings.lastBackup = Date.now(); // відлік тижня від увімкнення
    settings.backupSnooze = 0; LS.set("settings", settings);
    if (!settings.backupRemind) bkHide();
  });
  $("#bkSave", sh).addEventListener("click", () => { bkSave(); });
  $("#bkFile", sh).addEventListener("change", e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) bkRestore(f); });
}
function bkHide() { const b = $("#bk-bar"); if (!b) return; b.classList.remove("show"); setTimeout(() => { if (!b.classList.contains("show")) b.style.display = "none"; }, 400); }
function bkCheck() {
  if (!settings.backupRemind || document.hidden || !state.loaded || !state.child) return;
  const now = Date.now();
  if (now - (settings.lastBackup || 0) < BK_WEEK || now < (settings.backupSnooze || 0)) return;
  if ($("#sheet-root .sheet") || Together.end) return;
  const b = $("#bk-bar"); if (b.classList.contains("show")) return;
  const days = Math.floor((now - settings.lastBackup) / 86400000);
  $("#bk-t").textContent = "Минуло " + days + " дн. без резервної копії. Збережіть її, щоб не втратити записи.";
  b.style.display = "flex"; requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add("show")));
}
$("#bk-go").addEventListener("click", () => { bkSave(); });
$("#bk-later").addEventListener("click", () => { settings.backupSnooze = Date.now() + 24 * 3600 * 1000; LS.set("settings", settings); bkHide(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(bkCheck, 2500); });
setInterval(bkCheck, 5 * 60 * 1000);
setTimeout(bkCheck, 6000);

/* ============ toast ============ */
let toastT;
function toast(msg, actLabel, act) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ""}`;
  if (actLabel) t.querySelector("button").addEventListener("click", () => { t.classList.remove("show"); act(); });
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), actLabel ? 5000 : 2800);
}

  }

/* ============ ticker ============ */
function tick() {
  const now = Date.now();
  $$("[data-since]").forEach(el => el.textContent = fmtClock(now - +el.dataset.since));
  $$("[data-until]").forEach(el => el.textContent = fmtClock(+el.dataset.until - now));
  fitRings();
  $$("[data-ring-start]").forEach(r => {
    const p = clamp((now - +r.dataset.ringStart) / +r.dataset.ringLen, 0, 1);
    const bar = r.querySelector(".bar"); const C = 2 * Math.PI * 48; bar.setAttribute("stroke-dashoffset", C * (1 - p));
    r.classList.toggle("late", !r.classList.contains("asleep") && now - +r.dataset.ringStart > +r.dataset.ringLen);
  });
  Sound.tick(now);
}
setInterval(tick, 1000);
let lastMinute = new Date().getMinutes();
setInterval(() => { const m = new Date().getMinutes(); if (m !== lastMinute) { lastMinute = m; if (new Date().getSeconds() < 2 || m % 1 === 0) renderHome(); autoThemeCheck(); } }, 5000);

/* ============ sound engine (Web Audio, generated) ============ */
function seamless(sr, sec, gen) {
  const n = Math.floor(sr * sec), F = Math.floor(sr * 0.25);
  const raw = new Float32Array(n + F);
  for (let i = 0; i < n + F; i++) raw[i] = gen(i, i / sr);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = raw[i];
  for (let i = 0; i < F; i++) { const x = i / F; out[i] = raw[i] * Math.sin(x * Math.PI / 2) + raw[n + i] * Math.cos(x * Math.PI / 2); }
  return out;
}
function normalize(d, rms = 0.14) {
  let s = 0, pk = 0; for (let i = 0; i < d.length; i++) { s += d[i] * d[i]; const a = Math.abs(d[i]); if (a > pk) pk = a; }
  let k = rms / Math.sqrt(s / d.length || 1e-9); if (pk * k > 0.95) k = 0.95 / pk;
  for (let i = 0; i < d.length; i++) d[i] *= k;

function bindLulls() {
  const m = $("#lullMode"); if (m) initSeg(m, v => { settings.lullMode = v; LS.set("settings", settings); if (Lull.node) Lull.node.src.loop = v === "one"; });
  $$("[data-lull]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.lull; if (Lull.curId === id || Lull.loading === id) Lull.stop(); else Lull.play(id); }));
  $$("[data-lw]").forEach(b => b.addEventListener("click", () => { const t = lullById(b.dataset.lw); if (!t) return; if (t.w || !lullPlayable(t)) openLyrics(t.id); else if (Lull.curId === t.id) Lull.stop(); else Lull.play(t.id); }));
  $$("[data-ledit]").forEach(b => b.addEventListener("click", () => openLullEdit(b.dataset.ledit)));
  const add = $('[data-act="lull-add"]'); if (add) add.addEventListener("click", () => openLullEdit(null));
}
function openLyrics(id) {
  const t = lullById(id); if (!t) return;
  const btn = () => { const on = Lull.curId === t.id; return lullPlayable(t) ? `<button class="btn" id="lyPlay" style="width:100%">${on ? "■ Зупинити" : "▶ Грати мелодію"}</button>` : ""; };
  openSheet(`${sheetHead(esc(t.n))}
    <div class="muted small" style="margin:-4px 2px 12px">${t.own ? "Своя колискова" : esc(t.d)}</div>
    ${t.w ? `<div class="lyrics">${esc(t.w)}</div>` : `<p class="muted">Слів ще немає.${t.own ? " Їх можна додати кнопкою «Змінити»." : ""}</p>`}
    ${t.wn ? `<p class="muted small" style="margin:10px 2px 0">${esc(t.wn)}</p>` : ""}
    <div id="lyBtn" style="margin-top:16px">${btn()}</div>
    ${t.own ? `<button class="btn ghost" id="lyEdit" style="width:100%;margin-top:10px">Змінити</button>` : ""}
    <p class="muted small" style="margin:12px 2px 0">Наспівуйте разом із мелодією: малюкові найрідніший ваш голос.</p>`, sh => {
    const bind = () => { const p = $("#lyPlay", sh); if (p) p.addEventListener("click", async () => { if (Lull.curId === t.id) Lull.stop(); else await Lull.play(t.id); $("#lyBtn", sh).innerHTML = btn(); bind(); }); };
    bind();
    const e = $("#lyEdit", sh); if (e) e.addEventListener("click", () => openLullEdit(t.id));
  });
}
function openLullEdit(id) {
  const o = id ? (state.lulls || {})[id] : null; const nid = id || rid();
  const has = id && lullHasFile.has(id);
  openSheet(`${sheetHead(o ? "Своя колискова" : "Нова колискова")}
    <form class="form" id="lfForm">
      <div class="field"><label for="lfName">Назва</label><input class="input" id="lfName" maxlength="60" required value="${esc(o ? o.n : "")}" placeholder="Наприклад, Бабусина колискова"></div>
      <div class="field"><label for="lfWords">Слова (необовʼязково)</label><textarea class="input" id="lfWords" rows="7" maxlength="4000" style="resize:vertical;min-height:140px" placeholder="Кожен рядок з нового рядка">${esc(o && o.w || "")}</textarea></div>
      <div class="field"><label>Аудіо (необовʼязково)</label>
        <div class="muted small" id="lfFileTxt">${has ? "Файл є на цьому телефоні" + (o.fname ? ": " + esc(o.fname) : "") : o && o.file ? "Файл додали на іншому телефоні. Додайте його й тут, щоб грав." : "mp3, m4a або wav: ваш запис чи файл, на який у вас є права."}</div>
        <div class="btn-row" style="margin-top:8px"><label class="btn sm" for="lfFile">${has ? "Замінити файл" : "Обрати файл"}</label><input class="vh" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg" id="lfFile">${has ? `<button type="button" class="btn sm danger" id="lfFileDel">Прибрати файл</button>` : ""}</div>
      </div>
      <button class="btn" type="submit">Зберегти</button>
      ${o ? `<button class="btn danger" type="button" id="lfDel">Видалити колискову</button>` : ""}
    </form>
    <p class="muted small" style="margin:12px 2px 0">Назва і слова зберігаються в спільних даних. Сам аудіофайл лежить лише на цьому телефоні: він завеликий для спільної бази. Не завантажуйте чужі записи з YouTube чи стрімінгів.</p>`, sh => {
    let file = null, dropFile = false;
    const fin = $("#lfFile", sh);
    fin.addEventListener("change", () => { const f = fin.files && fin.files[0]; if (!f) return; if (f.size > 40 * 1024 * 1024) { toast("Файл завеликий: до 40 МБ"); fin.value = ""; return; } file = f; dropFile = false; $("#lfFileTxt", sh).textContent = "Обрано: " + f.name; if (!$("#lfName", sh).value.trim()) $("#lfName", sh).value = f.name.replace(/\.[^.]+$/, "").slice(0, 60); });
    const fd = $("#lfFileDel", sh); if (fd) fd.addEventListener("click", () => { dropFile = true; file = null; $("#lfFileTxt", sh).textContent = "Файл буде прибрано після збереження"; });
    $("#lfForm", sh).addEventListener("submit", async e => {
      e.preventDefault();
      const n = $("#lfName", sh).value.trim(); if (!n) return;
      const w = $("#lfWords", sh).value.replace(/\r/g, "").trim();
      if (file) {
        // check that the phone can decode it before saving
        try { if (!Sound.ensure()) throw 0; const ab = await file.arrayBuffer(); await new Promise((res, rej) => Sound.ctx.decodeAudioData(ab.slice(0), res, rej)); }
        catch (_) { toast("Цей файл не вдається відтворити. Спробуйте mp3 або m4a."); return; }
        try { await LullDB.put(nid, file); } catch (_) { toast("Не вдалося зберегти файл на телефоні"); return; }
      } else if (dropFile) { await LullDB.del(nid); if (Lull.curId === nid) Lull.stop(); }
      const data = { n, w, at: Date.now(), file: file ? true : dropFile ? false : !!(o && o.file), fname: file ? String(file.name).slice(0, 60) : dropFile ? "" : (o && o.fname) || "" };
      try { await store.setLull(nid, data); } catch (_) { return; }
      if (Lull.curId === nid && (file || dropFile)) Lull.stop();
      closeSheet(); toast("Збережено"); refreshLullFiles();
    });
    const del = $("#lfDel", sh);
    if (del) del.addEventListener("click", async () => {
      if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "Точно видалити?"; return; }
      if (Lull.curId === nid) Lull.stop();
      await LullDB.del(nid); try { await store.setLull(nid, null); } catch (_) { return; }
      closeSheet(); toast("Видалено"); refreshLullFiles();
    });
  });
}
refreshLullFiles();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (Sound.curId || Lull.curId) Sound.updateWake(); renderHome(); } });

/* ============ boot ============ */
applySettings();
renderAll();
store.init();
</script>
</body>
</html>
